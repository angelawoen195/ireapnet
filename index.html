    function validateStructureForm() {
      const code = document.getElementById("structureCode").value.trim().toUpperCase().replace(/\s+/g, "_");
      const name = document.getElementById("structureName").value.trim();
      const period = document.getElementById("structurePeriod").value;
      const active = document.getElementById("structureActive").checked;
      document.getElementById("structureCode").value = code;
      const errors = [];
      if (!code) errors.push("Kode Struktur Gaji wajib diisi.");
      if (!name) errors.push("Nama Struktur Gaji wajib diisi.");
      if (!period) errors.push("Tipe Periode wajib dipilih.");
      if (structures.some(item => item.code.toLowerCase() === code.toLowerCase() && item.code !== structureEditingCode)) errors.push("Kode Struktur Gaji tidak boleh duplikat.");
      if (structures.some(item => item.name.toLowerCase() === name.toLowerCase() && item.code !== structureEditingCode)) errors.push("Nama Struktur Gaji tidak boleh duplikat.");
      if (!structureComponents.length) errors.push("Minimal harus ada 1 Detail Komponen Gaji.");
      const sequences = new Set();
      const componentCodes = new Set();
      structureComponents.forEach(item => {
        if (!item.sequence || Number(item.sequence) <= 0) errors.push("Urutan harus angka lebih besar dari 0.");
        if (sequences.has(String(item.sequence))) errors.push("Urutan tidak boleh duplikat dalam struktur yang sama.");
        sequences.add(String(item.sequence));
        if (!item.component) errors.push("Komponen Gaji pada Detail Komponen Gaji wajib dipilih.");
        if (componentCodes.has(item.component)) errors.push("Komponen Gaji tidak boleh duplikat dalam struktur yang sama.");
        componentCodes.add(item.component);
        if (!item.label) errors.push("Nama Tampilan wajib diisi.");
      });
      const inputs = new Set();
      structureInputs.forEach(codeValue => {
        if (inputs.has(codeValue)) errors.push("Tipe Input Komponen Gaji tidak boleh duplikat dalam struktur yang sama.");
        inputs.add(codeValue);
      });
      showErrors(structureFormErrors, [...new Set(errors)]);
      return { valid: !errors.length, code, name, period, active };
    }

    function categoryHasParentCycle(code, parent) {
      let current = parent;
      const parentByCode = {};
      categories.forEach(item => {
        const itemCode = item.code === categoryEditingCode ? code : item.code;
        const itemParent = item.code === categoryEditingCode
          ? parent
          : item.parent === categoryEditingCode ? code : item.parent;
        parentByCode[itemCode] = itemParent;
      });
      const visited = new Set([code]);
      while (current) {
        if (visited.has(current)) return true;
        visited.add(current);
        current = parentByCode[current] || "";
      }
      return false;
    }

    function insertFormulaToken(token) {
      if (mode === "component-view") return;
      const input = document.getElementById("componentFormula");
      const start = input.selectionStart || input.value.length;
      const end = input.selectionEnd || input.value.length;
      const prefix = input.value.slice(0, start);
      const suffix = input.value.slice(end);
      const spacer = prefix && !/\s$/.test(prefix) ? " " : "";
      input.value = `${prefix}${spacer}${token}${suffix}`;
      input.focus();
      const cursor = prefix.length + spacer.length + token.length;
      input.setSelectionRange(cursor, cursor);
    }

      const formula = document.getElementById("componentFormula").value.trim();

      const errors = [];
      const oldSyntax = /work_entries|result\s*=|localdict/i;
      const sqlSyntax = /\b(SELECT|INSERT|UPDATE|DELETE|DROP|FROM|JOIN|WHERE)\b/i;

      if (!code) errors.push("Kode Komponen Gaji wajib diisi.");
      if (!name) errors.push("Nama Komponen Gaji wajib diisi.");
      if (!category) errors.push("Kategori Komponen Gaji wajib dipilih.");

        errors.push("Nama komponen gaji tidak boleh duplikat.");
      }
      if (formula && oldSyntax.test(formula)) errors.push("Formula harus menggunakan format Java-friendly expression.");
      if (formula && sqlSyntax.test(formula)) errors.push("Formula tidak boleh menggunakan query database langsung.");

      return { valid: !errors.length, code, name, category, formula, active };

    function makeRun(id, batch, structure, start, end, status, count) {
      const slips = Array.from({ length: count }).map((_, index) => {
        const tpl = slipTemplates[index % slipTemplates.length];
        const emp = employees[index] || employees[index % employees.length];
        return makeSlip(tpl.no.replace("/07/", start.slice(5,7) === "06" ? "/06/" : "/07/"), emp, tpl.values, status);
      });
      return {
        id,
        company: companyName,
        batch,
        structure,
        structureName: structures[structure].name,
        periodType: structures[structure].periodType,
        start,
        end,
        employeeCount: count,
        status,
        slips
      };
    }

    function makeStandaloneSlip(no, emp, structure, batch, start, end, status, values) {
      return {
        run: {
          id: "STANDALONE",

          batch,
          structure,
          structureName: structures[structure].name,
          periodType: structures[structure].periodType,
          start,
          end,
          status,
          slips: []
        },
        slip: makeSlip(no, emp, values, status)
      };
    }

    function makeSlip(no, emp, values, status) {
      return {
        no,
        nik: emp.nik,
        employee: emp.name,
        dept: emp.dept,
        position: emp.position,
        status,
        values: values.slice(),
        lines: [
          line(10, "GAJI_POKOK", "Gaji Pokok", values[0], false),
          line(20, "TUNJANGAN_TETAP", "Tunjangan Tetap", values[1], true),
          line(30, "LEMBUR", "Lembur", values[2], true),
          line(40, "BONUS", "Bonus", values[3], true),
          line(50, "POT_TERLAMBAT", "Potongan Terlambat", values[4], true),
          line(60, "BPJS_KES_KARYAWAN", "BPJS Kesehatan", values[5], false),
          line(90, "NET", "Take Home Pay", values[6], false)
        ],
        workEntries: baseWorkEntries.slice(0, 4).map(w => ({ code: w[0], name: w[1], qty: w[2], unit: w[3] })),
        inputs: cloneDefaultInputs(["BONUS", "POTONGAN_KOPERASI", "PINJAMAN"])
      };
    }

    function line(order, code, label, amount, adjustable) {
      return { order, code, label, system: amount, adjustment: amount, final: amount, adjustable };
    }

    function cloneDefaultInputs(codes) {
      return codes.map(code => ({ code, name: inputNames[code] || code, amount: defaultInputs[code]?.amount || 0, note: defaultInputs[code]?.note || "" }));

      const cls = status === "Baru" ? "draft" : status === "Terkonfirmasi" ? "pending" : status === "Selesai" ? "done" : status === "Terbayar" ? "paid" : "cancel";
      return `<span class="badge ${cls}">${status}</span>`;

    function onStructureChange() {
      const code = document.getElementById("structureSelect").value;
      document.getElementById("periodType").value = code ? structures[code].periodType : "";
      generateBatch();
    }

    function generateBatch() {
      const code = document.getElementById("structureSelect")?.value;
      const start = document.getElementById("periodStart")?.value;
      if (!code || !start) return;
      const month = new Date(start + "T00:00:00").toLocaleString("id-ID", { month: "long", year: "numeric" });
      document.getElementById("batchName").value = `${code} - ${month}`;
    }

    function periodDays(start, end) {
      const a = new Date(start + "T00:00:00");
      const b = new Date(end + "T00:00:00");
      return Math.round((b - a) / 86400000) + 1;
    }

    function validateCreateHeader() {
      const structure = document.getElementById("structureSelect").value;
      const start = document.getElementById("periodStart").value;
      const end = document.getElementById("periodEnd").value;
      const batch = document.getElementById("batchName").value.trim();
      const errors = [];
      if (!structure) errors.push("Struktur Gaji wajib dipilih.");
      if (!start) errors.push("Periode Mulai wajib diisi.");
      if (!end) errors.push("Periode Selesai wajib diisi.");
      if (!batch) errors.push("Batch wajib diisi.");
      if (structure && start && end) {
        const days = periodDays(start, end);
        if (structures[structure].periodType === "Mingguan" && days !== 7) errors.push("Periode Mingguan harus 7 hari.");
        if (structures[structure].periodType === "Bulanan" && (days < 28 || days > 31)) errors.push("Periode Bulanan harus 28 sampai 31 hari.");
      }
      showErrors("createErrors", errors);
      return { valid: !errors.length, structure, start, end, batch };
    }

    function applyFilter() {
      const result = validateCreateHeader();
      if (!result.valid) return;
      currentBatchDraft = result;
      selectedEmployees.clear();
      const contractType = document.getElementById("filterContractType").value;
      const religion = document.getElementById("filterReligion").value;
      const department = document.getElementById("filterDepartment").value;
      const position = document.getElementById("filterPosition").value;
      const employee = document.getElementById("filterEmployee").value;
      const filteredEmployees = employees.filter(emp =>
        (contractType === "Semua" || emp.contractType === contractType) &&
        (religion === "Semua" || emp.religion === religion) &&
        (department === "Semua" || emp.dept === department) &&
        (position === "Semua" || emp.position === position) &&
        (employee === "Semua" || emp.name === employee)
      );
      visibleEligibleNiks = filteredEmployees.map(emp => emp.nik);
      const area = document.getElementById("eligibleArea");
      area.classList.remove("hidden");
      area.innerHTML = `
        <div class="info-bar"><span>Eligible: <b>${filteredEmployees.length}</b></span><span class="info-link" onclick="openIneligible()">Tidak Eligible: ${ineligibleEmployees.length}</span></div>

            <tbody>${filteredEmployees.length ? filteredEmployees.map(emp => `<tr><td><input type="checkbox" data-nik="${emp.nik}" onchange="toggleEmployee('${emp.nik}', this.checked)"></td><td>${emp.nik}</td><td>${emp.name}</td><td>${emp.dept}</td><td>${emp.position}</td><td>${emp.contractType}</td><td>${emp.contract}</td><td><div class="action-row"><button class="btn teal small" type="button" data-module-action="openWorkEntries" data-module-args="${emp.nik}">Work Entries</button><button class="btn small" type="button" data-module-action="openInputs" data-module-args="${emp.nik}">Input Lain</button></div></td></tr>`).join("") : `<tr><td colspan="8" style="text-align:center;color:#777">Tidak ada karyawan eligible sesuai filter.</td></tr>`}</tbody>
          </table>
        </div>
      `;
    }

    function resetFilter() {
      selectedEmployees.clear();
      filterSelections = { department: "", position: "", employee: "" };
      if (document.getElementById("filterContractType")) document.getElementById("filterContractType").value = "Semua";
      if (document.getElementById("filterReligion")) document.getElementById("filterReligion").value = "Semua";
      ["filterDepartment", "filterPosition", "filterEmployee"].forEach(id => {
        if (document.getElementById(id)) document.getElementById(id).value = "Semua";
      });
      document.getElementById("eligibleArea").classList.add("hidden");
      document.getElementById("eligibleArea").innerHTML = "";
      showErrors("createErrors", []);
    }

    function toggleEmployee(nik, checked) {
      if (checked) selectedEmployees.add(nik); else selectedEmployees.delete(nik);
    }

    function toggleAllEmployees(checked) {
      visibleEligibleNiks.forEach(nik => checked ? selectedEmployees.add(nik) : selectedEmployees.delete(nik));
      document.querySelectorAll("[data-nik]").forEach(box => box.checked = checked);
    }

    function employeeByNik(nik) {
      return employees.find(emp => emp.nik === nik) || employees[0];

      const emp = employeeByNik(nik);

      showModal("workEntriesModal");

    function getEmployeeInputs(nik) {
      const structure = currentBatchDraft?.structure || "STAFF_MONTHLY";
      if (!employeeInputs[nik]) employeeInputs[nik] = cloneDefaultInputs(structures[structure].inputs);

    function openInputs(nik) {

    function saveInputs() {
      if (!currentInputNik) return;

      items.forEach((item, index) => {

      if (type === "department") return "Departemen";
      if (type === "position") return "Posisi";
      return "Karyawan";

      if (type === "department") return "filterDepartment";
      if (type === "position") return "filterPosition";
      return "filterEmployee";

    function openLookup(type) {
      activeLookupType = type;

    function renderLookupRows() {

      const rows = lookupData[activeLookupType].filter(item =>
        item.code.toLowerCase().includes(query) || item.name.toLowerCase().includes(query)

      if (!activeLookupType) return;

    function processPayroll() {
      const result = validateCreateHeader();
      if (!result.valid) return;
      if (!selectedEmployees.size) {
        showErrors("createErrors", ["Pilih minimal satu karyawan untuk diproses."]);
        return;
      }
      currentBatchDraft = result;
      startProgress([...selectedEmployees]);

    function startProgress(niks) {
      document.getElementById("progressTotal").textContent = niks.length;
      document.getElementById("progressDone").textContent = "0";
      document.getElementById("progressSuccess").textContent = "0";
      document.getElementById("progressFailed").textContent = "0";
      document.getElementById("progressBar").style.width = "0%";
      showModal("progressModal");
      let done = 0;
      const timer = setInterval(() => {
        done += 1;
        document.getElementById("progressDone").textContent = done;
        document.getElementById("progressSuccess").textContent = done;
        document.getElementById("progressBar").style.width = `${Math.round(done / niks.length * 100)}%`;
        if (done >= niks.length) {
          clearInterval(timer);
          createProcessedRun(niks);
          setTimeout(() => {
            closeModal("progressModal");
            renderRunDetail();
            showToast("Proses penggajian berhasil dibuat.");
          }, 500);
        }
      }, 450);
    }

    function createProcessedRun(niks) {
      const id = `RUN${String(payrollRuns.length + 1).padStart(3, "0")}`;
      const slips = niks.map((nik, index) => {
        const emp = employeeByNik(nik);
        const tpl = slipTemplates[index % slipTemplates.length];
        return makeSlip(`SLIP/2026/07/${String(index + 1).padStart(4, "0")}`, emp, tpl.values, "Terkonfirmasi");
      });
      const run = {
        id,
        company: companyName,
        batch: currentBatchDraft.batch,
        structure: currentBatchDraft.structure,
        structureName: structures[currentBatchDraft.structure].name,
        periodType: structures[currentBatchDraft.structure].periodType,
        start: currentBatchDraft.start,
        end: currentBatchDraft.end,
        employeeCount: slips.length,
        status: "Terkonfirmasi",
        slips
      };
      payrollRuns.unshift(run);
      currentRunId = id;
    }

    function openRunDetail(id) {
      currentRunId = id;
      renderRunDetail();
    }

    function currentRun() {
      return payrollRuns.find(run => run.id === currentRunId) || payrollRuns[0];
    }

    function getVisibleSlips(run) {
      const query = detailSearch.trim().toLowerCase();

      let rows = run.slips.filter(slip =>
        slip.no.toLowerCase().includes(query) ||
        slip.nik.toLowerCase().includes(query) ||
        slip.employee.toLowerCase().includes(query) ||
        slip.dept.toLowerCase().includes(query) ||
        slip.position.toLowerCase().includes(query)
      );

      if (detailPageSize !== "All") {
        rows = rows.slice(0, Number(detailPageSize));
      }

      return rows;
    }

    function setDetailPageSize(value) {
      detailPageSize = value;
      renderRunDetail();
    }

    function setDetailSearch(value) {
      detailSearch = value;
      renderRunDetail();
    }

    function getSlipRecords() {
      const runRecords = payrollRuns.flatMap(run => run.slips.map(slip => ({ run, slip })));
      return [...runRecords, ...standaloneSlipRows];
    }

    function findSlipRecord(no) {
      if (String(no).includes("|")) {
        const [runId, slipNo] = String(no).split("|");
        return getSlipRecords().find(record => record.run.id === runId && record.slip.no === slipNo);
      }
      return getSlipRecords().find(record => record.slip.no === no);
    }

    function getFilteredSlipRecords() {
      const query = slipListSearch.trim().toLowerCase();
      let rows = getSlipRecords().filter(({ run, slip }) =>
        (!slipListFilters.status || slip.status === slipListFilters.status) &&
        (!slipListFilters.structure || run.structure === slipListFilters.structure) &&
        (!slipListFilters.department || slip.dept === slipListFilters.department) &&
        (!slipListFilters.position || slip.position === slipListFilters.position) &&
        [slip.no, slip.nik, slip.employee, slip.dept, slip.position, run.batch, run.structureName, slip.status].join(" ").toLowerCase().includes(query)
      );
      if (slipListPageSize !== "All") rows = rows.slice(0, Number(slipListPageSize));
      return rows;
    }

    function setSlipListFilter(key, value) {
      slipListFilters[key] = value;
      renderSlipList();
    }

    function setSlipListPageSize(value) {
      slipListPageSize = value;
      renderSlipList();
    }

    function setSlipListSearch(value) {
      slipListSearch = value;
      renderSlipList();
    }

            <tbody>${rows.length ? rows.map(({ run, slip }) => `<tr><td>${slip.no}</td><td>${run.batch}</td><td>${fmtPeriod(run)}</td><td>${slip.nik}</td><td>${slip.employee}</td><td class="money-cell">${fmtMoney(slip.values[slip.values.length - 1])}</td><td>${badge(slip.status)}</td><td><div class="actions inline-actions"><button class="btn teal small icon-btn" type="button" title="Lihat" aria-label="Lihat" data-module-action="openSlipDetailPage" data-module-args="${encodeURIComponent(`${run.id}|${slip.no}`)}">${window.iconEye()}</button></div></td></tr>`).join("") : `<tr><td colspan="11" style="text-align:center;color:#777">Tidak ada data slip gaji.</td></tr>`}</tbody>

      `;
    }

    function openSlipDetailPage(key) {
      currentSlipPageKey = key;
      currentSlipPageNo = String(key).includes("|") ? String(key).split("|")[1] : key;
      renderSlipDetailPage("component");
    }

    function renderSlipDetailPage(tab = "component") {
      const record = findSlipRecord(currentSlipPageKey || currentSlipPageNo);
      if (!record) return renderSlipList();
      const { run, slip } = record;
      const locked = ["Selesai", "Terbayar"].includes(slip.status);
      setView("slipDetail", "Lihat Slip Gaji");
      slipDetailView.innerHTML = `
        <div class="toolbar" style="justify-content:flex-start">
          <button class="btn orange" type="button" onclick="recomputeSlipPage()">Hitung Ulang</button>
          <button class="btn" type="button" onclick="showToast('Slip gaji siap dicetak.')">Print</button>
          <button class="btn secondary" type="button" onclick="renderSlipList()">Kembali</button>

        <div class="summary-grid">
          <div><span>Status Slip Gaji</span><b>${badge(slip.status)}</b></div><div><span>No Slip Gaji</span><b>${slip.no}</b></div><div><span>Batch</span><b>${run.batch}</b></div>
          <div><span>Struktur Gaji</span><b>${run.structureName}</b></div><div><span>Tipe Periode</span><b>${run.periodType}</b></div><div><span>Periode</span><b>${fmtPeriod(run)}</b></div>
          <div><span>NIK</span><b>${slip.nik}</b></div><div><span>Nama Karyawan</span><b>${slip.employee}</b></div><div><span>Departemen</span><b>${slip.dept}</b></div><div><span>Posisi</span><b>${slip.position}</b></div>

          <button class="tab-btn ${tab === "input" ? "active" : ""}" type="button" onclick="renderSlipDetailPage('input')">Input Lain</button>
        </div>
        <div class="section">${renderSlipPageTabContent(slip, tab, locked)}</div>
      `;
    }

    function renderSlipPageTabContent(slip, tab, locked) {
      if (tab === "work") {
        return `<div class="table-wrap"><table><thead><tr><th>Kode</th><th>Nama</th><th style="width:130px">Jumlah</th><th style="width:130px">Satuan</th></tr></thead><tbody>${slip.workEntries.map(item => `<tr><td>${item.code}</td><td>${item.name}</td><td>${item.qty}</td><td>${item.unit}</td></tr>`).join("")}</tbody></table></div>`;
      }
      if (tab === "input") {
        return `<div class="table-wrap"><table><thead><tr><th style="width:180px">Kode Input</th><th>Nama Input</th><th style="width:180px">Nominal</th><th>Keterangan</th></tr></thead><tbody>${slip.inputs.map((item, index) => `<tr><td>${item.code}</td><td>${item.name}</td><td><input class="form-control" type="number" value="${item.amount}" data-page-input-amount="${index}" ${locked ? "readonly" : ""}></td><td><input class="form-control" type="text" value="${item.note}" data-page-input-note="${index}" ${locked ? "readonly" : ""}></td></tr>`).join("")}</tbody></table></div>`;
      }
      return `<div class="table-wrap"><table><thead><tr><th>Nama Tampilan</th><th style="width:140px">Hasil Sistem</th><th style="width:160px">Adjustment</th><th style="width:140px">Nominal Final</th></tr></thead><tbody>${slip.lines.map((line, index) => line.code === "NET" ? `<tr><td>${line.label}</td><td style="text-align:center;color:#999">-</td><td style="text-align:center;color:#999">-</td><td style="text-align:right">${fmtMoney(line.final)}</td></tr>` : `<tr><td>${line.label}</td><td style="text-align:right">${fmtMoney(line.system)}</td><td><input class="form-control" type="number" value="${line.adjustment}" data-page-adjust="${index}" oninput="updateSlipPageAdjustment(${index}, this.value)" ${locked || !line.adjustable ? "readonly" : ""}></td><td style="text-align:right" id="pageLineFinal${index}">${fmtMoney(line.final)}</td></tr>`).join("")}</tbody></table></div>`;
    }

    function updateSlipPageAdjustment(index, value) {
      const record = findSlipRecord(currentSlipPageKey || currentSlipPageNo);
      if (!record) return;
      const line = record.slip.lines[index];
      if (!line || !line.adjustable) return;
      line.adjustment = Number(value || 0);
      line.final = line.adjustment;
      record.slip.values[index] = line.final;
      const finalCell = document.getElementById(`pageLineFinal${index}`);
      if (finalCell) finalCell.textContent = fmtMoney(line.final);
    }

    function saveSlipPageAdjustment() {
      const record = findSlipRecord(currentSlipPageKey || currentSlipPageNo);
      if (!record) return;
      record.slip.lines.forEach((line, index) => {
        const input = document.querySelector(`[data-page-adjust="${index}"]`);
        if (input && line.adjustable) {
          line.adjustment = Number(input.value || 0);
          line.final = line.adjustment;
          record.slip.values[index] = line.final;
        }
      });
      showToast("Adjustment berhasil disimpan.");
      renderSlipDetailPage("component");
    }

    function saveSlipPageInput() {
      const record = findSlipRecord(currentSlipPageKey || currentSlipPageNo);
      if (!record || ["Selesai", "Terbayar"].includes(record.slip.status)) return;
      record.slip.inputs.forEach((item, index) => {
        const amount = document.querySelector(`[data-page-input-amount="${index}"]`);
        const note = document.querySelector(`[data-page-input-note="${index}"]`);
        if (amount) item.amount = Number(amount.value || 0);
        if (note) item.note = note.value;
      });
      showToast("Input lain berhasil disimpan.");
    }

    function recomputeSlipPage() {
      const record = findSlipRecord(currentSlipPageKey || currentSlipPageNo);
      if (!record) return;
      const slip = record.slip;
      const locked = ["Selesai", "Terbayar"].includes(slip.status);
      slip.lines.forEach((line, index) => {
        const input = document.querySelector(`[data-page-adjust="${index}"]`);
        if (input && line.adjustable && !locked) {
          line.adjustment = Number(input.value || 0);
          line.final = line.adjustment;
          slip.values[index] = line.final;
        }
      });
      if (!locked) {
        slip.inputs.forEach((item, index) => {
          const amount = document.querySelector(`[data-page-input-amount="${index}"]`);
          const note = document.querySelector(`[data-page-input-note="${index}"]`);
          if (amount) item.amount = Number(amount.value || 0);
          if (note) item.note = note.value;
        });
      }
      const inputTotal = code => slip.inputs
        .filter(item => item.code === code)
        .reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const bonusLine = slip.lines.find(line => line.code === "BONUS");
      if (bonusLine) {
        bonusLine.system = inputTotal("BONUS");
        bonusLine.adjustment = bonusLine.system;
        bonusLine.final = bonusLine.system;
        slip.values[3] = bonusLine.final;
      }
      const potonganInput = inputTotal("POTONGAN_KOPERASI") + inputTotal("PINJAMAN") + inputTotal("KOREKSI_POTONGAN");
      const potonganLine = slip.lines.find(line => line.code === "POT_TERLAMBAT");
      if (potonganLine && potonganInput) {
        potonganLine.system = -potonganInput;
        potonganLine.adjustment = potonganLine.system;
        potonganLine.final = potonganLine.system;
        slip.values[4] = potonganLine.final;
      }
      const totalNonNet = slip.values.slice(0, -1).reduce((sum, value) => sum + Number(value || 0), 0);
      slip.values[slip.values.length - 1] = totalNonNet;
      const netLine = slip.lines[slip.lines.length - 1];
      netLine.system = totalNonNet;
      netLine.adjustment = totalNonNet;
      netLine.final = totalNonNet;
      showToast("Slip gaji berhasil dihitung ulang.");
      renderSlipDetailPage("component");
    }

      setView("detail", "Lihat Proses Penggajian");
      detailView.innerHTML = `

            Menampilkan
            <select onchange="setDetailPageSize(this.value)" style="width:88px;margin:0 6px">
              <option value="10" ${detailPageSize === "10" ? "selected" : ""}>10</option>
              <option value="25" ${detailPageSize === "25" ? "selected" : ""}>25</option>
              <option value="50" ${detailPageSize === "50" ? "selected" : ""}>50</option>
              <option value="100" ${detailPageSize === "100" ? "selected" : ""}>100</option>

            Data
          </label>

            <tbody>${visibleSlips.map(slip => `<tr><td><input type="checkbox" data-print-slip="${slip.no}"></td><td>${slip.no}</td><td>${slip.nik}</td><td>${slip.employee}</td><td>${slip.dept}</td><td>${slip.position}</td>${slip.values.map(v => `<td class="money-cell">${fmtMoney(v)}</td>`).join("")}<td>${badge(slip.status)}</td><td><div class="actions"><button class="btn teal small" type="button" data-module-action="openSlip" data-module-args="${slip.no}">Lihat</button><button class="btn small" type="button" data-module-action="recomputeSlip" data-module-args="${slip.no}">Hitung Ulang</button></div></td></tr>`).join("")}</tbody>

    function recomputeAll() {
      showToast("Semua slip gaji berhasil dihitung ulang.");
    }

    function recomputeSlip(no) {
      const run = currentRun();
      const slip = run.slips.find(item => item.no === no);
      if (!slip) return;

      currentSlipNo = no;

      slip.lines.forEach((line, index) => {
        const input = document.querySelector(`[data-adjust="${index}"]`);
        if (input && line.adjustable) {
          line.adjustment = Number(input.value || 0);
          line.final = line.adjustment;
          slip.values[index] = line.final;
        }
      });

      if (!["Selesai", "Terbayar"].includes(run.status)) {
        slip.inputs.forEach((item, index) => {
          const amountInput = document.querySelector(`[data-slip-input-amount="${index}"]`);
          const noteInput = document.querySelector(`[data-slip-input-note="${index}"]`);
          if (amountInput) item.amount = Number(amountInput.value || 0);
          if (noteInput) item.note = noteInput.value;
        });
      }

      const inputTotal = code => slip.inputs
        .filter(item => item.code === code)
        .reduce((sum, item) => sum + Number(item.amount || 0), 0);

      const bonusLine = slip.lines.find(line => line.code === "BONUS");
      if (bonusLine) {
        bonusLine.system = inputTotal("BONUS");
        bonusLine.adjustment = bonusLine.system;
        bonusLine.final = bonusLine.system;
        slip.values[3] = bonusLine.final;
      }

      const potonganInput = inputTotal("POTONGAN_KOPERASI") + inputTotal("PINJAMAN") + inputTotal("KOREKSI_POTONGAN");
      const potonganLine = slip.lines.find(line => line.code === "POT_TERLAMBAT");
      if (potonganLine && potonganInput) {
        potonganLine.system = -potonganInput;
        potonganLine.adjustment = potonganLine.system;
        potonganLine.final = potonganLine.system;
        slip.values[4] = potonganLine.final;
      }

      const totalNonNet = slip.values.slice(0, -1).reduce((sum, value) => sum + Number(value || 0), 0);
      slip.values[slip.values.length - 1] = totalNonNet;

      const netLine = slip.lines[slip.lines.length - 1];
      netLine.system = totalNonNet;
      netLine.adjustment = totalNonNet;
      netLine.final = totalNonNet;

      showToast("Perubahan slip gaji berhasil disimpan dan dihitung ulang.");
      renderRunDetail();
      openSlip(no);
    }

    function printSelected() {
      const selected = [...document.querySelectorAll("[data-print-slip]:checked")].length;
      showToast(selected ? `${selected} slip gaji siap dicetak.` : "Pilih slip gaji terlebih dahulu.");
    }

    function setRunStatus(status) {
      const run = currentRun();
      run.status = status;
      run.slips.forEach(slip => slip.status = status);
      renderRunDetail();
      showToast(`Status proses penggajian menjadi ${status}.`);

    function openCancel() {
      showModal("cancelModal");
    }

    function confirmCancel() {
      closeModal("cancelModal");
      setRunStatus("Dibatalkan");
    }

    function openSlip(no) {
      currentSlipNo = no;
      const slip = currentRun().slips.find(item => item.no === no);
      document.getElementById("slipSummary").innerHTML = `
        <div><span>Status Slip Gaji</span><b>${badge(slip.status)}</b></div><div><span>No Slip Gaji</span><b>${slip.no}</b></div><div><span>Batch</span><b>${currentRun().batch}</b></div>
        <div><span>Struktur Gaji</span><b>${currentRun().structureName}</b></div><div><span>Periode</span><b>${fmtPeriod(currentRun())}</b></div><div><span>NIK</span><b>${slip.nik}</b></div>
        <div><span>Nama Karyawan</span><b>${slip.employee}</b></div><div><span>Departemen</span><b>${slip.dept}</b></div><div><span>Posisi</span><b>${slip.position}</b></div>
      `;
      renderSlipTabs("component");
      showModal("slipModal");

    function renderSlipTabs(tab) {
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.tab === tab));
      document.getElementById("slipComponentTab").classList.toggle("hidden", tab !== "component");
      document.getElementById("slipWorkTab").classList.toggle("hidden", tab !== "work");
      document.getElementById("slipInputTab").classList.toggle("hidden", tab !== "input");
      const slip = currentRun().slips.find(item => item.no === currentSlipNo);

        return `
          <tr>
            <td><input type="checkbox" ${canAct ? "" : "disabled"} ${selected ? "checked" : ""} data-module-action="toggleApprovalProcessSelection" data-module-args="${row.id}"></td>
            <td>${escapeHtml(row.submittedAt)}<div class="approval-muted">oleh: ${escapeHtml(row.requester)}</div></td>
            <td><button class="approval-doc-link" type="button" data-module-action="openApprovalProcessDocumentView" data-module-args="${row.id}">${escapeHtml(row.documentNo)}</button></td>
            <td><div class="approval-clamp">${escapeHtml(row.typeLabel)}</div></td>
            <td><div class="approval-clamp">${escapeHtml(row.object)}</div></td>
            <td>${escapeHtml(row.period || "-")}</td>
            <td><div class="approval-clamp">${escapeHtml(row.description || "-")}</div></td>
            <td><div class="approval-clamp">${escapeHtml(row.stage)}</div></td>
            <td class="approval-status-cell"><span class="approval-status-wrap">${approvalProcessStatusBadge(row.status)}<button class="approval-info-icon" type="button" title="Riwayat Approval" aria-label="Riwayat Approval" data-module-action="openApprovalProcessHistory" data-module-args="${row.id}">${iconInfo()}</button></span></td>
            <td class="approval-action-cell">${canAct ? `<div class="approval-row-actions"><button class="btn green btn-approval-compact" type="button" data-module-action="openApprovalProcessApprove" data-module-args="${row.id}">Setujui</button><button class="btn red btn-approval-compact" type="button" data-module-action="openApprovalProcessReject" data-module-args="${row.id}">Tolak</button></div>` : "-"}</td>
          </tr>
        `;
      }).join("") : '<tr><td colspan="10" style="text-align:center;color:#777">Data approval tidak ditemukan.</td></tr>';

      const shown = rows.length ? `1 - ${visibleRows.length}` : "0 - 0";
      approvalProcessPageInfo.textContent = `Menampilkan ${shown} dari ${rows.length} data`;
      const visiblePending = visibleRows.filter(row => row.status === "PENDING");
      document.getElementById("approvalProcessCheckAll").checked = visiblePending.length > 0 && visiblePending.every(row => approvalProcessSelectedIds.includes(row.id));
    }

    function toggleApprovalProcessSelection(id) {
      const row = approvalProcessFindRow(id);
      if (!row || row.status !== "PENDING") return;
      if (approvalProcessSelectedIds.includes(row.id)) {
        approvalProcessSelectedIds = approvalProcessSelectedIds.filter(item => item !== row.id);
      } else {
        approvalProcessSelectedIds.push(row.id);
      }
      renderApprovalProcessList();
    }

    function toggleAllApprovalProcessSelection() {
      const visiblePending = getApprovalProcessFilteredRows()
        .slice(0, Number(document.getElementById("approvalProcessPageSize").value || 10))
        .filter(row => row.status === "PENDING");
      const allSelected = visiblePending.length > 0 && visiblePending.every(row => approvalProcessSelectedIds.includes(row.id));
      if (allSelected) {
        approvalProcessSelectedIds = approvalProcessSelectedIds.filter(id => !visiblePending.some(row => row.id === id));
      } else {
        approvalProcessSelectedIds = [...new Set([...approvalProcessSelectedIds, ...visiblePending.map(row => row.id)])];
      }
      renderApprovalProcessList();
    }

    function openApprovalProcessApprove(id) {
      const row = approvalProcessFindRow(id);
      if (!row || row.status !== "PENDING") return;
      approvalProcessActionMode = "single";
      approvalProcessActionIds = [row.id];
      document.getElementById("approvalProcessApproveTitle").textContent = "Setujui Approval";
      document.getElementById("approvalProcessApproveMessage").textContent = "Apakah Anda yakin ingin menyetujui dokumen ini?";
      document.getElementById("approvalProcessApproveSummary").innerHTML = approvalProcessSummary(row);
      document.getElementById("approvalProcessApproveNote").value = "";
      approvalProcessApproveModal.classList.add("show");
    }

    function openApprovalProcessReject(id) {
      const row = approvalProcessFindRow(id);
      if (!row || row.status !== "PENDING") return;
      approvalProcessActionMode = "single";
      approvalProcessActionIds = [row.id];
      document.getElementById("approvalProcessRejectTitle").textContent = "Tolak Approval";
      document.getElementById("approvalProcessRejectMessage").textContent = "Masukkan alasan penolakan untuk dokumen ini.";
      document.getElementById("approvalProcessRejectSummary").innerHTML = approvalProcessSummary(row);
      document.getElementById("approvalProcessRejectNote").value = "";
      approvalProcessRejectErrors.classList.remove("show");
      approvalProcessRejectModal.classList.add("show");
    }

    function openApprovalProcessBulkApprove() {
      const ids = approvalProcessSelectedIds.filter(id => approvalProcessFindRow(id)?.status === "PENDING");
      if (!ids.length) {
        showToast("Pilih minimal satu dokumen approval.");
        return;
      }
      approvalProcessActionMode = "bulk";
      approvalProcessActionIds = ids;
      document.getElementById("approvalProcessApproveTitle").textContent = "Setujui Approval Terpilih";
      document.getElementById("approvalProcessApproveMessage").textContent = `Anda akan menyetujui ${ids.length} dokumen approval yang dipilih.`;
      document.getElementById("approvalProcessApproveSummary").innerHTML = ids.map(id => {
        const row = approvalProcessFindRow(id);
        return `<div><b>${escapeHtml(row.documentNo)}</b> - ${escapeHtml(row.typeLabel)}</div>`;
      }).join("");
      document.getElementById("approvalProcessApproveNote").value = "";
      approvalProcessApproveModal.classList.add("show");
    }

    function openApprovalProcessBulkReject() {
      const ids = approvalProcessSelectedIds.filter(id => approvalProcessFindRow(id)?.status === "PENDING");
      if (!ids.length) {
        showToast("Pilih minimal satu dokumen approval.");
        return;
      }
      approvalProcessActionMode = "bulk";
      approvalProcessActionIds = ids;
      document.getElementById("approvalProcessRejectTitle").textContent = "Tolak Approval Terpilih";
      document.getElementById("approvalProcessRejectMessage").textContent = `Anda akan menolak ${ids.length} dokumen approval yang dipilih.`;
      document.getElementById("approvalProcessRejectSummary").innerHTML = ids.map(id => {
        const row = approvalProcessFindRow(id);
        return `<div><b>${escapeHtml(row.documentNo)}</b> - ${escapeHtml(row.typeLabel)}</div>`;
      }).join("");
      document.getElementById("approvalProcessRejectNote").value = "";
      approvalProcessRejectErrors.classList.remove("show");
      approvalProcessRejectModal.classList.add("show");
    }

    function closeApprovalProcessApproveModal() {
      approvalProcessApproveModal.classList.remove("show");
      approvalProcessActionIds = [];
    }

    function closeApprovalProcessRejectModal() {
      approvalProcessRejectModal.classList.remove("show");
      approvalProcessRejectErrors.classList.remove("show");
      approvalProcessActionIds = [];
    }

    function confirmApprovalProcessApprove() {
      const note = document.getElementById("approvalProcessApproveNote").value.trim();
      approvalProcessRowsData = approvalProcessRowsData.map(row => (
        approvalProcessActionIds.includes(row.id) && row.status === "PENDING"
          ? { ...row, status: "APPROVED", note }
          : row
      ));
      approvalProcessSelectedIds = approvalProcessSelectedIds.filter(id => !approvalProcessActionIds.includes(id));
      closeApprovalProcessApproveModal();
      renderApprovalProcessList();
      showToast("Data berhasil disetujui.");
    }

    function confirmApprovalProcessReject() {
      const note = document.getElementById("approvalProcessRejectNote").value.trim();
      if (!note) {
        approvalProcessRejectErrors.textContent = "Catatan Penolakan wajib diisi.";
        approvalProcessRejectErrors.classList.add("show");
        return;
      }
      approvalProcessRowsData = approvalProcessRowsData.map(row => (
        approvalProcessActionIds.includes(row.id) && row.status === "PENDING"
          ? { ...row, status: "REJECTED", note }
          : row
      ));
      approvalProcessSelectedIds = approvalProcessSelectedIds.filter(id => !approvalProcessActionIds.includes(id));
      closeApprovalProcessRejectModal();
      renderApprovalProcessList();
      showToast("Data berhasil ditolak.");
    }

    function openApprovalProcessDocumentView(id) {
      const row = approvalProcessFindRow(id);
      if (!row) return;
      document.getElementById("crumbTitle").textContent = "Detail Dokumen Asal";
      approvalProcessListView.classList.add("hidden");
      approvalProcessDocumentView.classList.remove("hidden");
      document.getElementById("approvalProcessDocumentDetail").innerHTML = `
        <div class="approval-detail-row"><b>No Dokumen</b><div>${escapeHtml(row.documentNo)}</div></div>
        <div class="approval-detail-row"><b>Jenis Approval</b><div>${escapeHtml(row.typeLabel)}</div></div>
        <div class="approval-detail-row"><b>Objek Approval</b><div>${escapeHtml(row.object)}</div></div>
        <div class="approval-detail-row"><b>Periode</b><div>${escapeHtml(row.period || "-")}</div></div>
        <div class="approval-detail-row"><b>Keterangan</b><div>${escapeHtml(row.description || "-")}</div></div>
        <div class="approval-detail-row"><b>Status</b><div>${approvalProcessStatusBadge(row.status)}</div></div>
      `;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openApprovalProcessHistory(id) {
      const row = approvalProcessFindRow(id);
      if (!row) return;
      approvalProcessHistorySummary.innerHTML = approvalProcessSummary(row);
      approvalProcessHistoryRows.innerHTML = approvalProcessHistoryEntries(row).map(item => `
        <tr>
          <td>${escapeHtml(item.stage)}</td>
          <td>${escapeHtml(item.status)}</td>
          <td>${escapeHtml(item.by)}</td>
          <td>${escapeHtml(item.date)}</td>
          <td>${escapeHtml(item.note)}</td>
        </tr>
      `).join("");
      approvalProcessHistoryModal.classList.add("show");
    }

    function closeApprovalProcessHistory() {
      approvalProcessHistoryModal.classList.remove("show");
    }

    document.getElementById("approvalProcessStatusFilter").addEventListener("change", renderApprovalProcessList);
    document.getElementById("approvalProcessTypeFilter").addEventListener("change", renderApprovalProcessList);
    document.getElementById("approvalProcessDateFrom").addEventListener("change", renderApprovalProcessList);
    document.getElementById("approvalProcessDateTo").addEventListener("change", renderApprovalProcessList);
    document.getElementById("approvalProcessSearchBox").addEventListener("input", renderApprovalProcessList);
    document.getElementById("approvalProcessPageSize").addEventListener("change", renderApprovalProcessList);
    document.getElementById("approvalProcessCheckAll").addEventListener("change", toggleAllApprovalProcessSelection);
    document.getElementById("approvalProcessBulkApproveBtn").addEventListener("click", openApprovalProcessBulkApprove);
    document.getElementById("approvalProcessBulkRejectBtn").addEventListener("click", openApprovalProcessBulkReject);
    document.getElementById("approvalProcessDocumentBackBtn").addEventListener("click", renderApprovalProcessList);
    document.getElementById("approvalProcessApproveConfirmBtn").addEventListener("click", confirmApprovalProcessApprove);
    document.getElementById("approvalProcessApproveCancelBtn").addEventListener("click", closeApprovalProcessApproveModal);
    document.getElementById("approvalProcessRejectConfirmBtn").addEventListener("click", confirmApprovalProcessReject);
    document.getElementById("approvalProcessRejectCancelBtn").addEventListener("click", closeApprovalProcessRejectModal);
    document.getElementById("approvalProcessHistoryCloseBtn").addEventListener("click", closeApprovalProcessHistory);
    approvalProcessApproveModal.addEventListener("click", event => {
      if (event.target === approvalProcessApproveModal) closeApprovalProcessApproveModal();
    });
    approvalProcessRejectModal.addEventListener("click", event => {
      if (event.target === approvalProcessRejectModal) closeApprovalProcessRejectModal();
    });
    approvalProcessHistoryModal.addEventListener("click", event => {
      if (event.target === approvalProcessHistoryModal) closeApprovalProcessHistory();
    });

    renderApprovalProcessTypeOptions();
    renderApprovalProcessList();
</script>

  function escapeAdminHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  function cloneRequisition(row) {

  function todayIso() {

    return `<span class="badge ${cls}">${escapeAdminHtml(label)}</span>`;

  function approvalBadge(status) {
    const item = requisitionApprovalLabels[status] || ["-", "muted"];
    return requisitionBadge(item[0], item[1]);

    const item = requisitionNeedLabels[status] || ["-", "muted"];

  function renderTimelineRows(timeline, targetId, emptyId) {
    const target = el(targetId);

      target.innerHTML = "";
      empty.classList.remove("hidden");
      return;

    empty.classList.add("hidden");

        <td>${escapeAdminHtml(item.stage)}</td>
        <td>${approvalBadge(item.status === "Dibatalkan" ? "CANCELED" : item.status === "Ditolak" ? "REJECTED" : item.status === "Disetujui" ? "APPROVED" : item.status === "Menunggu" ? "PENDING" : "DRAFT")}</td>

        <td>${escapeAdminHtml(item.date)}</td>
        <td>${escapeAdminHtml(item.note)}</td>

  function filteredEmployeeRequisitions() {
    const query = el("employeeRequisitionSearchBox").value.trim().toLowerCase();
    const dateFrom = el("employeeRequisitionDateFromFilter").value;
    const dateTo = el("employeeRequisitionDateToFilter").value;
    const approvalFilter = el("employeeRequisitionApprovalFilter").value;
    const fulfillmentFilter = el("employeeRequisitionFulfillmentFilter").value;
    const departmentFilter = el("employeeRequisitionDepartmentFilter").value;
    const employeeTypeFilter = el("employeeRequisitionEmployeeTypeFilter").value;
    return employeeRequisitions.filter(row => {
      const matchesDateFrom = !dateFrom || row.requisition_date >= dateFrom;
      const matchesDateTo = !dateTo || row.requisition_date <= dateTo;
      const matchesApproval = approvalFilter === "all" || row.approval_status === approvalFilter;
      const matchesFulfillment = fulfillmentFilter === "all" || row.fulfillment_status === fulfillmentFilter;
      const matchesDepartment = departmentFilter === "all" || row.department === departmentFilter;
      const matchesEmployeeType = employeeTypeFilter === "all" || row.employee_type === employeeTypeFilter;
      const haystack = [
        row.requisition_no,
        row.requisition_date,
        row.requested_by,
        row.department,
        row.job_position,
        row.employee_type,
        row.need_status,
        row.approval_status,
        row.fulfillment_status
      ].join(" ").toLowerCase();
      return matchesDateFrom
        && matchesDateTo
        && matchesApproval
        && matchesFulfillment
        && matchesDepartment
        && matchesEmployeeType
        && haystack.includes(query);
    });
  }

  function renderEmployeeRequisitionFilterOptions() {

      `<option value="${escapeAdminHtml(item)}">${escapeAdminHtml(item)}</option>`
    )).join("");

      `<option value="${escapeAdminHtml(item)}">${escapeAdminHtml(item)}</option>`
    )).join("");
    el("employeeRequisitionDepartmentFilter").value = departments.includes(departmentValue) ? departmentValue : "all";
    el("employeeRequisitionEmployeeTypeFilter").value = employeeTypes.includes(employeeTypeValue) ? employeeTypeValue : "all";

    const buttons = [`<button class="btn secondary" type="button" data-module-action="renderEmployeeRequisitionList">Kembali</button>`];

      buttons.push(`<button class="btn employee-requisition-submit" type="button" data-module-action="submitEmployeeRequisition" data-module-args="${row.id}">Ajukan</button>`);
      buttons.push(`<button class="btn employee-requisition-cancel" type="button" data-module-action="openEmployeeRequisitionCancelModal" data-module-args="${row.id}">Batal</button>`);
    } else if (row.approval_status === "PENDING") {
      buttons.push(`<button class="btn employee-requisition-cancel" type="button" data-module-action="openEmployeeRequisitionCancelModal" data-module-args="${row.id}">Batal</button>`);
    } else if (row.approval_status === "APPROVED" && row.fulfillment_status !== "TERPENUHI") {
      buttons.push(`<button class="btn employee-requisition-fulfill" type="button" data-module-action="openEmployeeRequisitionFulfillmentModal" data-module-args="${row.id}">Terpenuhi</button>`);
      buttons.push(`<button class="btn employee-requisition-cancel" type="button" data-module-action="openEmployeeRequisitionCancelModal" data-module-args="${row.id}">Batal</button>`);
      buttons.push(`<button class="btn employee-requisition-duplicate" type="button" data-module-action="openEmployeeRequisitionDuplicate" data-module-args="${row.id}">Duplikat</button>`);
    } else {
      buttons.push(`<button class="btn employee-requisition-duplicate" type="button" data-module-action="openEmployeeRequisitionDuplicate" data-module-args="${row.id}">Duplikat</button>`);

  function getEmployeeRequisitionFormData() {
    return {
      requisition_no: el("employeeRequisitionNo").value.trim(),
      requisition_date: el("employeeRequisitionDate").value.trim(),
      requested_by: el("employeeRequisitionRequestedBy").value.trim(),
      department: el("employeeRequisitionDepartment").value.trim(),
      job_position: el("employeeRequisitionPosition").value.trim(),
      employee_type: el("employeeRequisitionEmployeeType").value.trim(),
      requested_qty: Number(el("employeeRequisitionQty").value || 0),
      target_start_date: el("employeeRequisitionTargetStartDate").value.trim(),
      need_status: el("employeeRequisitionNeedStatus").value,
      reason: el("employeeRequisitionReason").value.trim(),
      candidate_requirement: el("employeeRequisitionCandidateRequirement").value.trim(),
      job_description: el("employeeRequisitionJobDescription").value.trim()
    };
  }

  function validateEmployeeRequisitionForm(data) {
    const errors = [];
    if (!data.requisition_date) errors.push("Tanggal Permohonan wajib diisi.");
    if (!data.department) errors.push("Departemen Pemohon wajib diisi.");
    if (!data.job_position) errors.push("Posisi / Jabatan wajib diisi.");
    if (!data.employee_type) errors.push("Tipe Karyawan wajib diisi.");
    if (!data.requested_qty || data.requested_qty < 1) errors.push("Jumlah Kebutuhan wajib diisi.");
    if (!data.target_start_date) errors.push("Target Masuk wajib diisi.");
    if (!data.need_status) errors.push("Status Kebutuhan wajib diisi.");
    if (!data.reason) errors.push("Alasan Kebutuhan wajib diisi.");
    const box = el("employeeRequisitionFormErrors");
    if (!errors.length) {
      box.classList.remove("show");
      box.innerHTML = "";
      return true;
    }
    box.innerHTML = errors.map(error => `<div>${escapeAdminHtml(error)}</div>`).join("");
    box.classList.add("show");
    return false;
  }

  function openEmployeeRequisitionCreate() {
    employeeRequisitionEditingId = null;
    employeeRequisitionViewingId = null;
    const draft = {
      requisition_no: generateRequisitionNo(),
      requisition_date: todayIso(),
      requested_by: loggedInEmployeeRequisitionUser,
      department: "",
      job_position: "",
      employee_type: "",
      requested_qty: 1,
      target_start_date: "",
      need_status: "BARU",
      reason: "",
      candidate_requirement: "",
      job_description: "",
      approval_status: "DRAFT",
      fulfillment_status: "BELUM_TERPENUHI",
      fulfilled_qty: 0,
      fulfilled_date: "",
      cancel_reason: "",
      approval_timeline: []
    };
    fillEmployeeRequisitionForm(draft);
    el("employeeRequisitionFormCancelBtn").classList.add("hidden");
    el("employeeRequisitionFormCancelBtn").dataset.moduleArgs = "";
    el("employeeRequisitionFormErrors").classList.remove("show");
    setEmployeeRequisitionScreen("form", "Tambah");
  }

  function openEmployeeRequisitionEdit(id) {
    const row = employeeRequisitions.find(item => item.id === Number(id));
    if (!row || row.approval_status !== "DRAFT") return;
    employeeRequisitionEditingId = row.id;
    employeeRequisitionViewingId = null;
    fillEmployeeRequisitionForm(row);
    el("employeeRequisitionFormCancelBtn").classList.remove("hidden");
    el("employeeRequisitionFormCancelBtn").dataset.moduleArgs = String(row.id);
    el("employeeRequisitionFormErrors").classList.remove("show");
    setEmployeeRequisitionScreen("form", "Ubah");
  }

  function openEmployeeRequisitionView(id) {
    const row = employeeRequisitions.find(item => item.id === Number(id));
    if (!row) return;
    employeeRequisitionViewingId = row.id;
    employeeRequisitionEditingId = null;
    fillEmployeeRequisitionView(row);
    setEmployeeRequisitionScreen("view", "Lihat");
  }

  function openEmployeeRequisitionDuplicate(id) {
    const row = employeeRequisitions.find(item => item.id === Number(id));
    if (!row) return;
    employeeRequisitionEditingId = null;
    employeeRequisitionViewingId = null;
    const copy = cloneRequisition(row);
    copy.requisition_no = generateRequisitionNo();
    copy.requisition_date = todayIso();
    copy.approval_status = "DRAFT";
    copy.fulfillment_status = "BELUM_TERPENUHI";
    copy.fulfilled_qty = 0;
    copy.fulfilled_date = "";
    copy.cancel_reason = "";
    copy.approval_timeline = [];
    fillEmployeeRequisitionForm(copy);
    el("employeeRequisitionFormCancelBtn").classList.add("hidden");
    el("employeeRequisitionFormCancelBtn").dataset.moduleArgs = "";
    el("employeeRequisitionFormErrors").classList.remove("show");
    setEmployeeRequisitionScreen("form", "Tambah");
  }

  function upsertEmployeeRequisitionFromForm(submit = false) {
    const data = getEmployeeRequisitionFormData();
    if (!validateEmployeeRequisitionForm(data)) return false;
    const isEdit = employeeRequisitionEditingId != null;
    let row = isEdit ? employeeRequisitions.find(item => item.id === employeeRequisitionEditingId) : null;
    if (!row) {
      row = {
        id: employeeRequisitionNoSeed++,
        approval_status: "DRAFT",
        fulfillment_status: "BELUM_TERPENUHI",
        fulfilled_qty: 0,
        fulfilled_date: "",
        cancel_reason: "",
        approval_timeline: []
      };
      employeeRequisitions.unshift(row);
    }
    Object.assign(row, data, {
      approval_status: submit ? "PENDING" : "DRAFT",
      fulfillment_status: row.fulfillment_status === "TERPENUHI" ? "TERPENUHI" : "BELUM_TERPENUHI",
      fulfilled_qty: row.fulfilled_qty || 0,
      fulfilled_date: row.fulfilled_date || "",
      cancel_reason: row.cancel_reason || ""
    });
    if (submit) {
      row.approval_timeline = row.approval_timeline && row.approval_timeline.length ? row.approval_timeline : [
        { stage: "Approval Atasan Langsung", status: "Menunggu", by: "-", date: "-", note: "-" },
        { stage: "Approval HR", status: "Menunggu", by: "-", date: "-", note: "-" }
      ];
    }
    employeeRequisitionEditingId = null;
    employeeRequisitionViewingId = null;
    renderEmployeeRequisitionList();
    showEmployeeRequisitionToast(submit ? "Data berhasil diajukan." : "Data berhasil disimpan.");
    return true;
  }

  function saveEmployeeRequisition() {
    upsertEmployeeRequisitionFromForm(false);
  }

  function submitEmployeeRequisition(id) {
    if (typeof id === "number" || typeof id === "string") {
      const row = employeeRequisitions.find(item => item.id === Number(id));
      if (!row || row.approval_status !== "DRAFT") return;
      row.approval_status = "PENDING";
      row.approval_timeline = row.approval_timeline && row.approval_timeline.length ? row.approval_timeline : [
        { stage: "Approval Atasan Langsung", status: "Menunggu", by: "-", date: "-", note: "-" },
        { stage: "Approval HR", status: "Menunggu", by: "-", date: "-", note: "-" }
      ];
      renderEmployeeRequisitionList();
      showEmployeeRequisitionToast("Data berhasil diajukan.");
      return;
    }
    upsertEmployeeRequisitionFromForm(true);
  }

  function openEmployeeRequisitionCancelModal(id) {
    const row = employeeRequisitions.find(item => item.id === Number(id));
    if (!row) return;
    employeeRequisitionCancelId = row.id;
    el("employeeRequisitionCancelErrors").classList.remove("show");
    el("employeeRequisitionCancelSummary").innerHTML = [
      requisitionSummaryRow("No Permohonan", escapeAdminHtml(row.requisition_no)),
      requisitionSummaryRow("Diajukan Oleh", escapeAdminHtml(row.requested_by)),
      requisitionSummaryRow("Posisi / Jabatan", escapeAdminHtml(row.job_position)),
      requisitionSummaryRow("Status Approval", approvalBadge(row.approval_status))
    ].join("");
    el("employeeRequisitionCancelReasonInput").value = row.cancel_reason || "";
    el("employeeRequisitionCancelSaveBtn").dataset.moduleArgs = String(row.id);
    el("employeeRequisitionCancelModal").classList.add("show");
  }

  function closeEmployeeRequisitionCancelModal() {
    el("employeeRequisitionCancelModal").classList.remove("show");
    employeeRequisitionCancelId = null;
  }

  function cancelEmployeeRequisition(id) {
    const row = employeeRequisitions.find(item => item.id === Number(id || employeeRequisitionCancelId));
    if (!row) return;
    const reason = el("employeeRequisitionCancelReasonInput").value.trim();
    if (!reason) {
      el("employeeRequisitionCancelErrors").innerHTML = "Alasan Pembatalan wajib diisi.";
      el("employeeRequisitionCancelErrors").classList.add("show");
      return;
    }
    row.approval_status = "CANCELED";
    row.cancel_reason = reason;
    row.fulfillment_status = "BELUM_TERPENUHI";
    row.approval_timeline = row.approval_timeline && row.approval_timeline.length ? row.approval_timeline : [];
    row.approval_timeline.push({ stage: "Approval HR", status: "Dibatalkan", by: row.requested_by, date: todayIso(), note: reason });
    closeEmployeeRequisitionCancelModal();
    renderEmployeeRequisitionList();
    showEmployeeRequisitionToast("Permohonan berhasil dibatalkan.");
  }

    const row = employeeRequisitions.find(item => item.id === Number(id));
    if (!row || row.approval_status !== "APPROVED" || row.fulfillment_status === "TERPENUHI") return;
    employeeRequisitionFulfillmentId = row.id;
    el("employeeRequisitionFulfillmentErrors").classList.remove("show");

    el("employeeRequisitionFulfillmentModal").classList.remove("show");
    employeeRequisitionFulfillmentId = null;
  }

  function openEmployeeRequisitionApprovalHistory(id) {
    const row = employeeRequisitions.find(item => item.id === Number(id));
    if (!row) return;
    const timeline = row.approval_timeline || [];
    el("employeeRequisitionApprovalHistorySummary").innerHTML = employeeRequisitionApprovalHistorySummary(row);

    el("employeeRequisitionApprovalHistoryModal").classList.remove("show");
  }

  function saveEmployeeRequisitionFulfillment(id) {
    const row = employeeRequisitions.find(item => item.id === Number(id || employeeRequisitionFulfillmentId));
    if (!row) return;
    const qty = Number(el("employeeRequisitionFulfillmentQtyInput").value || 0);
    const date = el("employeeRequisitionFulfillmentDateInput").value.trim();
    if (!qty || qty < 1) {
      el("employeeRequisitionFulfillmentErrors").innerHTML = "Jumlah Terpenuhi wajib diisi.";
      el("employeeRequisitionFulfillmentErrors").classList.add("show");

      el("employeeRequisitionFulfillmentErrors").innerHTML = "Tanggal Pemenuhan wajib diisi.";
      el("employeeRequisitionFulfillmentErrors").classList.add("show");
      return;
    }
    row.fulfillment_status = "TERPENUHI";
    row.fulfilled_qty = qty;
    row.fulfilled_date = date;
    closeEmployeeRequisitionFulfillmentModal();
    renderEmployeeRequisitionList();
    showEmployeeRequisitionToast("Pemenuhan karyawan berhasil disimpan.");

      return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 21c-1.1 0-2-.9-2-2V8h14v11c0 1.1-.9 2-2 2H7ZM9 4h6l1 2h4v2H4V6h4l1-2Zm0 6v8h2v-8H9Zm4 0v8h2v-8h-2Z"/></svg>';
    }

    window.iconEye = iconEye;
    window.iconPencil = iconPencil;
    window.iconTrash = iconTrash;

    function getModuleSource(moduleKey) {
      const moduleDef = APP_MODULES[moduleKey];
      if (!moduleDef) throw new Error(`Module "${moduleKey}" belum terdaftar di APP_MODULES.`);
      return readEmbeddedPage(moduleDef.sourceId);
    }

    function parseModule(moduleKey) {
      if (!moduleCache[moduleKey]) {
        const parsed = new DOMParser().parseFromString(getModuleSource(moduleKey), 'text/html');
        moduleCache[moduleKey] = {
          styles: Array.from(parsed.querySelectorAll('style')).map(style => style.textContent).join('\n'),
          body: parsed.body ? parsed.body.innerHTML : '',
          script: Array.from(parsed.querySelectorAll('script')).map(script => script.textContent).join('\n')
        };
      }
      return moduleCache[moduleKey];
    }

    function setCrumbs(route, menu, title) {
      crumbGroup.textContent = route.group;
      crumbMenu.textContent = menu || route.menu;
      crumbTitle.textContent = title || route.title || '';
      const crumbLength = ['Beranda', route.group, menu || route.menu, title || route.title || ''].join('').length;
      crumbs.classList.toggle('long-breadcrumb', crumbLength > 78);
    }

    function setActiveRoute(routeKey) {
      document.querySelectorAll('.submenu-item').forEach(item => item.classList.toggle('active', item.dataset.route === routeKey));
      document.querySelectorAll('.nav-item').forEach(item => {
        if (!item.closest('.nav-group')) item.classList.toggle('active', item.dataset.route === routeKey);
      });
      const active = document.querySelector('[data-route="' + routeKey + '"]');
      document.querySelectorAll('.nav-group').forEach(group => {
        const open = active && group.contains(active);
        group.classList.toggle('open', open);
        const button = group.querySelector('.nav-item');
        if (button) button.classList.toggle('active', open);
      });
    }

    const missingElementWarnings = new Set();

    function getModuleElementById(id) {
      return moduleRoot.querySelector('#' + CSS.escape(id));
    }

    function createSafeElementStub() {
      const noop = () => {};
      return new Proxy({}, {
        get(target, prop) {
          if (prop === 'addEventListener') return noop;
          if (prop === 'removeEventListener') return noop;
          if (prop === 'setAttribute') return noop;
          if (prop === 'getAttribute') return () => null;
          if (prop === 'contains') return () => false;
          if (prop === 'closest') return () => null;
          if (prop === 'querySelector') return () => null;
          if (prop === 'querySelectorAll') return () => [];
          if (prop === 'appendChild') return noop;
          if (prop === 'removeChild') return noop;
          if (prop === 'dispatchEvent') return () => false;
          if (prop === 'focus') return noop;
          if (prop === 'blur') return noop;
          if (prop === 'classList') return { add: noop, remove: noop, toggle: noop, contains: () => false };
          if (prop === 'style') return {};
          if (prop === 'dataset') return {};
          if (prop === 'value') return '';
          if (prop === 'textContent') return '';
          if (prop === 'innerHTML') return '';
          if (prop === 'checked') return false;
          if (prop === 'parentNode') return null;
          if (prop === 'children') return [];
          return undefined;
        }
      });
    }

    function warnMissingElement(key, type = 'id') {
      const warningKey = `${type}:${key}`;
      if (missingElementWarnings.has(warningKey)) return;
      const label = type === 'selector' ? 'selector' : 'id';
      console.warn(`Element dengan ${label} "${key}" tidak ditemukan di module aktif.`);
      missingElementWarnings.add(warningKey);
    }

    function getShellElement(id) {
      return document.getElementById(id);
    }

    function createScopedDocument() {
      const queryInModule = selector => {
        try {
          return moduleRoot.querySelector(selector);
        } catch (error) {
          console.warn(`Selector module tidak valid: "${selector}"`, error);
          return null;
        }
      };
      const queryAllInModule = selector => {
        try {
          return moduleRoot.querySelectorAll(selector);
        } catch (error) {
          console.warn(`Selector module tidak valid: "${selector}"`, error);
          return [];
        }
      };
      const resolveElement = id => {
        const scopedElement = getModuleElementById(id);
        if (scopedElement) return scopedElement;
        warnMissingElement(id, 'id');
        return createSafeElementStub();
      };
      return {
        getElementById: id => resolveElement(id),
        querySelector: selector => queryInModule(selector),
        querySelectorAll: selector => queryAllInModule(selector),
        createElement: tagName => document.createElement(tagName),
        createTextNode: text => document.createTextNode(text),
        addEventListener: (...args) => moduleRoot.addEventListener(...args),
        removeEventListener: (...args) => moduleRoot.removeEventListener(...args),
        getShellElement,
        body: moduleRoot,
        documentElement: moduleHost
      };
    }

    /*
      Legacy compatibility only.
      Screen baru harus render badge/status secara eksplisit dari render function.
      Jangan mengandalkan auto-normalize ini untuk screen baru.
    */
    function normalizeStatusBadges() {
      moduleRoot.querySelectorAll('table td').forEach(td => {
        if (td.querySelector('.status-badge-normalized,.badge')) return;
        const found = statusMap[td.textContent.trim().toLowerCase()];
        if (!found) return;
        td.innerHTML = `<span class="status-badge-normalized ${found[1]}">${found[0]}</span>`;
      });
    }

    function inlineDatasetKey(type) {
      return 'inline' + type[0].toUpperCase() + type.slice(1);
    }

    function inlineSelector(type) {
      return '[data-inline-' + type + ']';
    }

    function captureInlineHandlers() {
      moduleRoot.querySelectorAll('[onclick],[onchange],[oninput]').forEach(element => {
        ['click', 'change', 'input'].forEach(type => {
          const attrName = 'on' + type;
          if (!element.hasAttribute(attrName)) return;
          element.dataset[inlineDatasetKey(type)] = element.getAttribute(attrName);
          element.removeAttribute(attrName);
        });
      });
    }

    function runInlineHandler(expression, event) {
      if (!expression) return;
      const scope = {};
      Object.keys(activeModuleApi || {}).forEach(key => {
        scope[key] = activeModuleApi[key];
      });
      scope.event = event;
      scope.document = createScopedDocument();
      scope.window = window;
      try {
        const runner = new Function('scope', 'event', `with (scope) { ${expression}; }`);
        runner.call(event.target, scope, event);
        afterModuleRender();
      } catch (error) {
        console.warn("Inline handler failed:", expression, error);
      }
    }

    function parseModuleArgs(value) {
      if (value == null) return [];
      const raw = String(value).trim();
      if (!raw) return [];
      if (raw.startsWith('[') && raw.endsWith(']')) {
        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed;
        } catch (error) {
          // Fallback ke format lama.
        }
      }
      return raw.split('|').map(item => {
        const trimmed = item.trim();
        if (/^-?\d+(\.\d+)?$/.test(trimmed)) return Number(trimmed);
        if (trimmed === 'true') return true;
        if (trimmed === 'false') return false;
        if (trimmed === 'null') return null;
        try {
          return decodeURIComponent(trimmed);
        } catch (error) {
          return trimmed;
        }
      });
    }

    function runModuleAction(target) {
      const actionName = target.dataset.moduleAction;
      const fn = activeModuleApi[actionName];
      if (typeof fn !== 'function') {
        console.warn(`Module action "${actionName}" tidak ditemukan di module aktif.`);
        return;
      }
      try {
        const args = parseModuleArgs(target.dataset.moduleArgs);
        fn(...args);
        afterModuleRender();
      } catch (error) {
        console.warn("Module action failed:", actionName, parseModuleArgs(target.dataset.moduleArgs), error);
      }
    }

    function bindModuleActionButtons() {
      moduleRoot.querySelectorAll('[data-module-action]').forEach(button => {
        if (button.dataset.moduleActionBound === '1') return;
        button.dataset.moduleActionBound = '1';
        button.addEventListener('click', event => {
          event.preventDefault();
          event.stopPropagation();
          runModuleAction(button);
        });
      });
    }

    function findEventTarget(event, selector) {
      if (event.target && event.target.closest) {
        const closest = event.target.closest(selector);
        if (closest) return closest;
      }
      return event.composedPath ? event.composedPath().find(item => item?.matches?.(selector)) : null;
    }

    function bindInlineHandlerBridge() {
      if (inlineBridgeBound) return;
      inlineBridgeBound = true;
      ['click', 'change', 'input'].forEach(type => {
        moduleRoot.addEventListener(type, event => {
          if (type === 'click') {
            const actionTarget = findEventTarget(event, '[data-module-action]');
            if (actionTarget) {
              event.preventDefault();
              runModuleAction(actionTarget);
              return;
            }
          }
          const attrName = 'on' + type;
          const target = findEventTarget(event, `${inlineSelector(type)},[${attrName}]`);
          if (!target) return;
          const expression = target.dataset[inlineDatasetKey(type)] || target.getAttribute(attrName);
          if (target.hasAttribute(attrName)) {
            target.dataset[inlineDatasetKey(type)] = expression;
            target.removeAttribute(attrName);
          }
          event.preventDefault();
          runInlineHandler(expression, event);
        });
      });
    }

    function syncCrumbsFromModule() {
      const route = routes[currentRouteKey];
      if (!route) return;
      const title = getModuleElementById('crumbTitle');
      const titleHidden = title && (title.classList.contains('hidden') || getComputedStyle(title).display === 'none');
      const moduleTitle = title && !titleHidden ? title.textContent.trim() : '';
      const nextTitle = moduleTitle && moduleTitle !== route.menu ? moduleTitle : route.title;
      setCrumbs(route, route.menu, nextTitle);
    }

    function afterModuleRender() {
      captureInlineHandlers();
      bindModuleActionButtons();
      normalizeStatusBadges();
      syncCrumbsFromModule();
    }

    function scheduleAfterModuleRender() {
      if (afterRenderQueued) return;
      afterRenderQueued = true;
      requestAnimationFrame(() => {
        afterRenderQueued = false;
        afterModuleRender();
      });
    }

    function exposeModuleApi(script) {
      const scopedDocument = createScopedDocument();
      const functionNames = Array.from(new Set([
        ...Array.from(script.matchAll(/function\s+([A-Za-z_$][\w$]*)\s*\(/g)).map(match => match[1]),
        ...Array.from(script.matchAll(/(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s+)?(?:function\b|\([^)]*\)\s*=>|[A-Za-z_$][\w$]*\s*=>)/g)).map(match => match[1])
      ]));
      const exportExpression = functionNames.map(name => `${JSON.stringify(name)}: typeof ${name} === 'function' ? ${name} : undefined`).join(',');
      const runner = new Function('document', 'window', `
        return (function(){
          ${script}
          return { ${exportExpression} };
        }).call(window);
      `);
      const scopedWindow = new Proxy(window, {
        get(target, prop) {
          if (prop === 'document') return scopedDocument;
          if (['scrollTo', 'scroll', 'scrollBy'].includes(prop)) return target[prop].bind(target);
          return target[prop];
        },
        set(target, prop, value) {
          target[prop] = value;
          return true;
        }
      });
      const nextModuleApi = runner(scopedDocument, scopedWindow) || {};
      activeModuleApi = Object.fromEntries(
        Object.entries(nextModuleApi).filter(([, value]) => typeof value === 'function')
      );
    }

    function mountModule(moduleKey) {
      const module = parseModule(moduleKey);
      if (moduleObserver) moduleObserver.disconnect();
      moduleRoot.innerHTML = `<style>${module.styles}\n${SHARED_MODULE_STYLE}</style>${module.body}`;
      exposeModuleApi(module.script);
      moduleObserver = new MutationObserver(scheduleAfterModuleRender);
      moduleObserver.observe(moduleRoot, { childList: true, subtree: true, characterData: true, attributes: true });
      afterModuleRender();
    }

    function callRoute(route) {
      const routeFn = activeModuleApi[route.fn];
      if (typeof routeFn !== 'function') {
        console.warn(`Route function "${route.fn}" tidak ditemukan di module aktif.`);
        return;
      }
      try {
        routeFn();
        afterModuleRender();
      } catch (error) {
        console.warn('Route function failed:', route.fn, error);
      }
    }

    function openRoute(routeKey) {
      const route = routes[routeKey];
      if (!route) {
        console.warn(`Route "${routeKey}" belum terdaftar di APP_ROUTES.`);
        return;
      }
      currentRouteKey = routeKey;
      setActiveRoute(routeKey);
      setCrumbs(route);
      if (currentModule !== route.module) {
        currentModule = route.module;
        mountModule(route.module);
      }
      callRoute(route);
    }
    document.getElementById('sidebarBtn').addEventListener('click', () => {
      document.getElementById('appShell').classList.toggle('sidebar-collapsed');
    });
    renderSidebarMenu();
    document.getElementById('sidebarMenu').addEventListener('click', event => {
      const target = event.target.closest ? event.target : event.target.parentElement;
      const toggleButton = target.closest('[data-toggle-group]');
      if (toggleButton) {
        toggleButton.closest('.nav-group').classList.toggle('open');
        return;
      }
      const routeButton = target.closest('[data-route]');
      if (routeButton) openRoute(routeButton.dataset.route);
    });

    openRoute('general.company');
  </script>
</body>
</html>
