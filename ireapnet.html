    :root {

    body {

    .app {

      transition: grid-template-columns .18s ease;
    }
    .sidebar {
      grid-row: 1 / 4;
      background: #fff;

      box-shadow: 1px 0 3px rgba(0,0,0,.22);
      z-index: 3;

      color: #fff;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 16px;
      color: #2387d7;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .logo-mark {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      color: #163772;
      background: radial-gradient(circle at 42% 35%, #ff613b 0 48%, #d92d20 49% 100%);
      border: 3px solid #0497d4;
      font-weight: 800;
      font-size: 25px;
      font-family: Georgia, serif;
    }
    .company { line-height: 1.55; font-size: 14px; font-weight: 700; margin-bottom: 10px; }
    .user-card { background: #fff; color: #314a8f; border-radius: 4px; padding: 6px 8px; line-height: 1.45; font-weight: 700; }
    .menu-search { height: 34px; display: flex; align-items: center; gap: 4px; padding: 0 12px; border-bottom: 1px solid #e5e5e5; color: #999; font-size: 14px; }
    .nav-item {
      height: 46px;
      display: grid;
      grid-template-columns: 34px 1fr 20px;
      align-items: center;
      width: 100%;
      padding: 0 16px;
      color: #666;
      border: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .nav-item .icon { color: #666; font-size: 15px; text-align: center; }
    .nav-item.active { color: #455ba8; background: #f9f9f9; }
    .nav-group.open > .nav-item .chevron { transform: rotate(-90deg); }
    .chevron { display: inline-block; transition: transform .15s ease; text-align: center; }
    .submenu { display: none; padding: 4px 0 7px; border-bottom: 1px solid #e5e5e5; background: #f7f7f7; }
    .nav-group.open .submenu { display: block; }
    .submenu-item {
      display: grid;
      grid-template-columns: 34px 1fr;
      align-items: center;
      width: 100%;
      min-height: 34px;
      padding: 0 15px 0 28px;
      border: 0;
      background: transparent;
      color: #666;
      text-align: left;
      cursor: pointer;
    }
    .submenu-item:hover, .submenu-item.active { color: #4157a8; background: #fff; }
    .submenu-dot { width: 6px; height: 6px; border-radius: 50%; background: #b8b8b8; justify-self: center; }
    .submenu-item.active .submenu-dot { background: #4157a8; }
    .app.sidebar-collapsed { grid-template-columns: 60px 1fr; }
    .app.sidebar-collapsed .brand-panel { height: 60px; padding: 10px; }
    .app.sidebar-collapsed .logo { justify-content: center; margin: 0; }
    .app.sidebar-collapsed .logo span:last-child,
    .app.sidebar-collapsed .company,
    .app.sidebar-collapsed .user-card,
    .app.sidebar-collapsed .menu-search span,
    .app.sidebar-collapsed .nav-item span:not(.icon),
    .app.sidebar-collapsed .submenu { display: none; }
    .app.sidebar-collapsed .menu-search { justify-content: center; padding: 0; }
    .app.sidebar-collapsed .nav-item { grid-template-columns: 1fr; justify-items: center; padding: 0; }
    .topbar {
      grid-column: 2;
      height: 60px;
      background: var(--blue);
      border-bottom: 2px solid #6379c4;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px 0 20px;
      box-shadow: 0 2px 4px rgba(0,0,0,.2);
    }
    .crumbs { display: flex; align-items: center; gap: 13px; font-weight: 700; }
    .hamburger { width: 38px; height: 30px; border: 1px solid rgba(255,255,255,.12); border-radius: 3px; background: rgba(255,255,255,.04); color: #fff; font-size: 20px; line-height: 1; cursor: pointer; }
    .account { display: flex; align-items: center; gap: 8px; font-weight: 700; }
    .company-select { width: 265px; height: 28px; border: 1px solid #ccc; border-radius: 4px; color: #555; background: #fff; padding: 0 8px; }
    main { grid-column: 2; min-width: 0; max-width: 100%; padding: 30px 34px 62px; background: var(--sky); }
    .content-card { min-width: 0; max-width: 100%; min-height: 0; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.24); overflow: visible; }
    #moduleHost { display: block; min-width: 0; max-width: 100%; min-height: 320px; background: #fff; }
    footer { grid-column: 2; display: grid; grid-template-columns: 250px 1fr 100px; align-items: center; height: 34px; padding: 0 20px; background: #fff; color: #4b5564; font-size: 10px; }
    footer .copy { text-align: center; }
    footer b { color: #1f2d3a; }
  </style>
</head>

<style>
    :root {
      --blue: #3f55aa;
      --blue-dark: #314377;
      --sky: #7fb0cf;
      --line: #e4e6eb;
      --text: #3f4d5c;

.switch-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
    }

    .switch {
      position: relative;
      width: 43px;
      height: 22px;
      display: inline-block;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #c8cbd2;
      border-radius: 20px;
      transition: .15s;
    }

    .slider:before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 2px;
      top: 2px;
      background: #fff;
      border-radius: 50%;
      transition: .15s;
      box-shadow: 0 1px 3px rgba(0,0,0,.25);
    }

    .switch input:checked + .slider { background: var(--green); }
    .switch input:checked + .slider:before { transform: translateX(21px); }

    .upload-box {
      min-height: 118px;
      border: 1px dashed #bfc7d8;
      border-radius: 4px;
      display: grid;
      grid-template-columns: 94px 1fr;
      align-items: center;

      background: #fbfcff;

      overflow: hidden;

    #authTargetModal .auth-target-check-label input[type="checkbox"] {

    }

    #authTargetModal .auth-target-table-wrap {

    #authTargetModal thead th {

    .multi-select {
      position: relative;
      margin: 8px 0 16px;
    }

    .multi-field {
      min-height: 35px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      width: 100%;
      padding: 4px 34px 4px 7px;
      border: 1px solid #ddd;
      background: #fff;
      color: #555;
      text-align: left;
      cursor: pointer;
    }

    .multi-field:after {
      content: "▾";
      position: absolute;
      right: 11px;
      top: 10px;

      font-size: 12px;
    }

    .multi-placeholder {
      color: #999;

    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 24px;
      max-width: 100%;
      padding: 3px 7px;
      border: 1px solid #cfd7f4;

    }

    .chip button {
      border: 0;

      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .multi-menu {
      display: none;
      position: absolute;
      z-index: 25;
      left: 0;
      right: 0;
      top: calc(100% + 3px);
      border: 1px solid #cfcfcf;
      background: #fff;
      box-shadow: 0 4px 14px rgba(0,0,0,.15);
    }

    .multi-select.open .multi-menu {
      display: block;
    }

    .multi-search {

    .multi-options {

    .multi-option {

    }

    .multi-option:hover,

      background: #f4f7ff;
      color: #344a96;
    }

    .multi-empty {
      padding: 10px;
      color: #888;
    }

    function validateUserForm(data) {
      const errors = [];
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const currentId = editingUserId;
      if (!data.username) errors.push("Username wajib diisi.");
      if (data.username && users.some(item => item.username.toLowerCase() === data.username.toLowerCase() && item.id !== currentId)) errors.push("Username tidak boleh duplikat.");
      if (!data.email) errors.push("Email wajib diisi.");
      if (data.email && !emailPattern.test(data.email)) errors.push("Format Email tidak valid.");
      if (data.email && users.some(item => item.email.toLowerCase() === data.email.toLowerCase() && item.id !== currentId)) errors.push("Email tidak boleh duplikat.");
      if (!data.display_name) errors.push("Display Name wajib diisi.");
      if (!data.user_type) errors.push("User Type wajib dipilih.");
      if (userMode === "create") {
        if (!data.password) errors.push("Password wajib diisi.");
        if (!data.confirm_password) errors.push("Konfirmasi Password wajib diisi.");
        if (data.password && data.confirm_password && data.password !== data.confirm_password) errors.push("Password dan Konfirmasi Password harus sama.");
      }
      if (!currentUserAccess.length) errors.push("Minimal 1 akses perusahaan wajib diisi.");
      const companyIds = currentUserAccess.map(item => Number(item.company_id));
      if (new Set(companyIds).size !== companyIds.length) errors.push("Perusahaan tidak boleh duplikat dalam akses pengguna.");
      currentUserAccess.forEach(item => {
        if (!item.company_id) errors.push("Setiap akses perusahaan wajib memiliki Perusahaan.");
        if (!item.role_id) errors.push("Setiap akses perusahaan wajib memiliki Role.");
      });
      const defaults = currentUserAccess.filter(item => item.is_default);
      if (currentUserAccess.length && defaults.length !== 1) errors.push("Harus ada tepat 1 akses perusahaan yang menjadi default.");
      showUserErrors(userFormErrors, errors);
      return !errors.length;
    }

    function saveUserForm() {
      const data = readUserForm();
      if (!validateUserForm(data)) return;
      const payload = {
        username: data.username,
        email: data.email,
        display_name: data.display_name,
        user_type: data.user_type,
        is_active: data.is_active,
        access: currentUserAccess.map(item => ({ ...item }))
      };
      if (userMode === "edit") {
        const targetId = Number(editingUserId);
        const user = users.find(item => item.id === targetId);
        if (!user) {
          console.warn("Pengguna: data yang akan diubah tidak ditemukan.", { id: editingUserId });
          return;
        }
        Object.assign(user, payload);
        editingUserId = null;
        openUserList();
        showToast("Data berhasil diperbarui.");
        return;
      }
      const nextId = Math.max(...users.map(item => item.id), 0) + 1;
      users.unshift({
        id: nextId,
        ...payload,
        last_login_at: "-",
        protected_user: false
      });
      openUserList();
      showToast("Data berhasil ditambahkan.");
    }

      const errors = [];
      if (!password) errors.push("Password Baru wajib diisi.");
      if (!confirmPassword) errors.push("Konfirmasi Password Baru wajib diisi.");

    function saveUserAccess() {
      const data = {
        company_id: Number(document.getElementById("userAccessCompany").value),
        role_id: Number(document.getElementById("userAccessRole").value),
        is_default: document.getElementById("userAccessDefault").checked
      };
      const errors = [];
      if (!data.company_id) errors.push("Perusahaan wajib dipilih.");
      if (!data.role_id) errors.push("Role wajib dipilih.");
      if (data.company_id && currentUserAccess.some((item, index) => item.company_id === data.company_id && index !== editingAccessIndex)) {
        errors.push("Perusahaan tidak boleh duplikat dalam akses pengguna.");
      }
      showUserErrors(userAccessErrors, errors);
      if (errors.length) return;
      if (data.is_default) currentUserAccess.forEach(item => item.is_default = false);
      if (editingAccessIndex === null) currentUserAccess.push(data);
      else currentUserAccess[editingAccessIndex] = data;
      if (!currentUserAccess.some(item => item.is_default) && currentUserAccess.length) currentUserAccess[0].is_default = true;
      closeUserAccessModal();
      renderUserAccessRows();

    function removeUserAccess(index) {

      deleteUserId = id;
      showUserErrors(document.getElementById("deleteUserErrors"), []);
      document.getElementById("deleteUserMessage").textContent = `Apakah Anda yakin ingin menghapus Pengguna ${user.username || user.display_name || "ini"}?`;
      deleteUserModal.classList.add("show");

    function closeDeleteUser() {
      deleteUserModal.classList.remove("show");
      deleteUserId = null;
    }

    function confirmDeleteUser() {
      const targetId = Number(deleteUserId);
      const user = users.find(item => item.id === targetId);
      if (!user) {
        console.warn("Pengguna: target hapus tidak ditemukan.", { id: deleteUserId, total: users.length });
        return;
      }
      if (user.protected_user) {
        showUserErrors(document.getElementById("deleteUserErrors"), ["Pengguna ini tidak dapat dihapus karena sedang digunakan atau merupakan pengguna utama."]);
        return;
      }
      const before = users.length;
      users = users.filter(item => item.id !== targetId);
      if (users.length === before) {
        console.warn("Pengguna: data tidak terhapus.", { id: targetId, before, after: users.length });
        return;
      }
      closeDeleteUser();
      openUserList();
      showToast("Data berhasil dihapus.");

    function readModuleForm() {
      return {
        module_code: document.getElementById("moduleCode").value.trim(),
        module_name: document.getElementById("moduleName").value.trim(),
        path: document.getElementById("modulePath").value.trim(),
        parent: document.getElementById("moduleParent").value.trim(),
        sequence: document.getElementById("moduleSequence").value.trim()
      };

    function showModuleFormErrors(errors) {
      moduleFormErrors.innerHTML = errors.join("<br>");
      moduleFormErrors.classList.toggle("show", errors.length > 0);
    }

    function validateModule(data, currentId = null, targetBox = moduleFormErrors) {
      const errors = [];
      if (!data.module_code) errors.push("Kode Modul wajib diisi.");
      if (!data.module_name) errors.push("Nama Modul wajib diisi.");
      if (!data.path) errors.push("Path wajib diisi.");
      if (!data.parent) errors.push("Parent wajib diisi.");
      if (!data.sequence) errors.push("Sequence wajib diisi.");
      if (data.sequence && !/^\d+$/.test(data.sequence)) errors.push("Sequence harus berupa angka.");
      if (data.module_code && moduleData.some(item => item.module_code.toLowerCase() === data.module_code.toLowerCase() && item.id !== currentId)) {
        errors.push("Kode Modul tidak boleh duplikat.");
      }
      if (targetBox === moduleErrors) showModuleErrors(errors);
      else showModuleFormErrors(errors);
      return !errors.length;
    }

    function filteredModules() {
      const q = document.getElementById("moduleSearchBox").value.trim().toLowerCase();
      return moduleData.filter(item => `${item.module_code} ${item.module_name} ${item.path} ${item.parent} ${item.sequence}`.toLowerCase().includes(q));
    }

    function renderModules() {
      const rows = filteredModules();
      const pageSize = Number(document.getElementById("modulePageSize").value || 10);
      const visibleRows = rows.slice(0, pageSize);
      document.getElementById("moduleRows").innerHTML = visibleRows.map(item => {
        return `
          <tr>
            <td>${escapeHtml(item.module_code)}</td>
            <td>${escapeHtml(item.module_name)}</td>
            <td>${escapeHtml(item.path)}</td>
            <td>${escapeHtml(item.parent)}</td>
            <td>${escapeHtml(item.sequence)}</td>
            <td class="action-cell">
              <div class="actions inline-actions">
                <button class="btn teal small icon-btn" type="button" title="Lihat" aria-label="Lihat" data-module-action="openModuleView" data-module-args="${item.id}">${window.iconEye()}</button>
                <button class="btn small icon-btn" type="button" title="Ubah" aria-label="Ubah" data-module-action="openEditModule" data-module-args="${item.id}">${window.iconPencil()}</button>
                <button class="btn red small icon-btn" type="button" title="Hapus" aria-label="Hapus" data-module-action="openDeleteModule" data-module-args="${item.id}">${window.iconTrash()}</button>
              </div>
            </td>
          </tr>

      }).join("");
      const shown = rows.length ? `1 - ${visibleRows.length}` : "0 - 0";

      showModuleErrors([]);

      setPage("module");
      renderModules();

    function fillModuleForm(item = null) {
      document.getElementById("moduleCode").value = item?.module_code || "";
      document.getElementById("moduleName").value = item?.module_name || "";
      document.getElementById("modulePath").value = item?.path || "";
      document.getElementById("moduleParent").value = item?.parent || "";
      document.getElementById("moduleSequence").value = item?.sequence || "";
      showModuleFormErrors([]);
    }

    function openModuleCreate() {
      editingModuleId = null;
      fillModuleForm(null);
      setActiveSubmenu("moduleMenu");
      setPage("module-create");

    function saveModuleForm() {
      const data = readModuleForm();
      if (!validateModule(data, editingModuleId)) return;
      const isEdit = Boolean(editingModuleId);
      if (isEdit) {
        const targetId = Number(editingModuleId);
        const item = moduleData.find(module => module.id === targetId);
        if (!item) {
          console.warn("Modul: data yang akan diubah tidak ditemukan.", { id: editingModuleId });
          return;
        }
        Object.assign(item, data);
      } else {
        const nextId = Math.max(...moduleData.map(item => item.id), 0) + 1;
        moduleData.push({ id: nextId, ...data });
      }
      editingModuleId = null;
      openModulePage();
      showToast(isEdit ? "Data berhasil diperbarui." : "Data berhasil ditambahkan.");
    }

    function openEditModule(id) {
      const item = moduleData.find(module => module.id === id);
      if (!item) return;
      editingModuleId = id;
      fillModuleForm(item);
      setActiveSubmenu("moduleMenu");
      setPage("module-edit");
    }

    function openModuleView(id) {
      const item = moduleData.find(module => module.id === id);
      if (!item) return;
      document.getElementById("moduleViewCode").value = item.module_code;
      document.getElementById("moduleViewName").value = item.module_name;
      document.getElementById("moduleViewPath").value = item.path;
      document.getElementById("moduleViewParent").value = item.parent;
      document.getElementById("moduleViewSequence").value = item.sequence;
      setActiveSubmenu("moduleMenu");
      setPage("module-view");
    }

    function openDeleteModule(id) {
      const item = moduleData.find(module => module.id === Number(id));
      if (!item) return;
      deleteModuleId = id;
      document.getElementById("deleteModuleMessage").textContent = `Apakah Anda yakin ingin menghapus Modul ${item.module_name || item.module_code || "ini"}?`;
      deleteModuleModal.classList.add("show");
    }

    function closeDeleteModule() {
      deleteModuleModal.classList.remove("show");
      deleteModuleId = null;
    }

    function confirmDeleteModule() {
      if (!deleteModuleId) return;
      const targetId = Number(deleteModuleId);
      const before = moduleData.length;
      moduleData = moduleData.filter(item => item.id !== targetId);
      if (moduleData.length === before) {
        console.warn("Modul: target hapus tidak ditemukan.", { id: deleteModuleId, before, after: moduleData.length });
        return;
      }
      if (editingModuleId === targetId) editingModuleId = null;

    function filteredAuthRoles() {

              <button class="btn red small icon-btn" type="button" title="Hapus" aria-label="Hapus" data-module-action="openDeleteAuth" data-module-args="${role.code}">${window.iconTrash()}</button>

    function openAuthList() {

      authEditingCode = null;
      setActiveSubmenu("authMenu");
      setPage("auth-list");
      renderAuthList();
    }

    function clonePermissionModules(roleCode = null) {
      const existing = roleCode ? (authPermissions[roleCode] || []) : [];
      return permissionModules.map(module => {
        const found = existing.find(item => item.code === module.code);
        return {
          ...module,
          checked: Boolean(found),
          scope: found ? copyAuthScope(found.scope) : emptyScope("ALL")
        };
      });
    }

    function renderAuthModules() {
      document.getElementById("authModuleRows").innerHTML = currentAuthModules.map(module => `
        <tr>
          <td><input type="checkbox" ${module.checked ? "checked" : ""} onchange="toggleAuthModule('${module.code}', this.checked)"></td>
          <td>${escapeHtml(module.code)}</td>
          <td>${escapeHtml(module.name)}</td>
          <td>${escapeHtml(module.parent)}</td>
          <td><span class="badge ${authBadgeClass(module.scope)}">${scopeModeText(module.scope)}</span></td>
          <td><span class="badge muted">${escapeHtml(authScopeDetail(module.scope))}</span></td>
          <td><button class="btn secondary small" type="button" data-module-action="openAuthScopeModal" data-module-args="single|${module.code}">Ubah Scope</button></td>
        </tr>
      `).join("");
      document.getElementById("authCheckAll").checked = currentAuthModules.every(module => module.checked);
    }

    function toggleAuthModule(code, checked) {
      const module = currentAuthModules.find(item => item.code === code);
      if (!module) return;
      module.checked = checked;
      if (checked && !module.scope) module.scope = emptyScope("ALL");
      renderAuthModules();
    }

    function openAuthCreate() {
      authMode = "create";
      authEditingCode = null;
      document.getElementById("authCode").value = "";
      document.getElementById("authName").value = "";
      document.getElementById("authActive").checked = true;
      updateAuthActiveLabel();
      currentAuthModules = clonePermissionModules();
      pendingAuthBulkScope = null;
      document.getElementById("authBulkHint").textContent = "";
      showAuthErrors(authFormErrors, []);
      setActiveSubmenu("authMenu");
      setPage("auth-create");
      renderAuthModules();
    }

    function openAuthEdit(code) {
      const role = authRoles.find(item => item.code === code);
      if (!role) return;
      authMode = "edit";
      authEditingCode = code;
      document.getElementById("authCode").value = role.code;
      document.getElementById("authName").value = role.name;
      document.getElementById("authActive").checked = role.active;
      updateAuthActiveLabel();
      currentAuthModules = clonePermissionModules(code);
      pendingAuthBulkScope = null;
      document.getElementById("authBulkHint").textContent = "";
      showAuthErrors(authFormErrors, []);
      setActiveSubmenu("authMenu");
      setPage("auth-edit");
      renderAuthModules();
    }

    function readAuthForm() {
      return {
        code: document.getElementById("authCode").value.trim(),
        name: document.getElementById("authName").value.trim(),
        active: document.getElementById("authActive").checked
      };
    }

    function validateAuthForm(data) {
      const errors = [];
      if (!data.code) errors.push("Kode Role wajib diisi.");
      if (!data.name) errors.push("Nama Role wajib diisi.");
      if (data.code && authRoles.some(item => item.code.toLowerCase() === data.code.toLowerCase() && item.code !== authEditingCode)) errors.push("Kode Role tidak boleh duplikat.");
      if (data.name && authRoles.some(item => item.name.toLowerCase() === data.name.toLowerCase() && item.code !== authEditingCode)) errors.push("Nama Role tidak boleh duplikat.");
      const checked = currentAuthModules.filter(module => module.checked);
      if (!checked.length) errors.push("Minimal 1 modul harus dicentang.");
      checked.forEach(module => validateAuthScope(module.scope).forEach(error => errors.push(`${module.name}: ${error}`)));
      showAuthErrors(authFormErrors, errors);
      return !errors.length;
    }

    function saveAuthForm() {
      const data = readAuthForm();
      if (!validateAuthForm(data)) return;
      const permissions = currentAuthModules
        .filter(module => module.checked)
        .map(module => ({ code: module.code, scope: copyAuthScope(module.scope) }));
      const isEdit = authMode === "edit";
      if (isEdit) {
        const role = authRoles.find(item => item.code === authEditingCode);
        if (!role) {
          console.warn("Role: data yang akan diubah tidak ditemukan.", { code: authEditingCode });
          return;
        }
        const oldCode = role.code;
        role.code = data.code;
        role.name = data.name;
        role.active = data.active;
        if (oldCode !== data.code) delete authPermissions[oldCode];
        authPermissions[data.code] = permissions;
      } else {
        authRoles.push({ ...data, used_by_user: false });
        authPermissions[data.code] = permissions;
      }
      authEditingCode = null;
      openAuthList();
      showToast(isEdit ? "Data berhasil diperbarui." : "Data berhasil ditambahkan.");
    }

    function openAuthView(code) {
      const role = authRoles.find(item => item.code === code);
      if (!role) return;
      authViewingCode = code;
      document.getElementById("authViewCode").value = role.code;
      document.getElementById("authViewName").value = role.name;
      document.getElementById("authViewStatus").innerHTML = activeBadge(role.active);
      const permissions = authPermissions[code] || [];
      document.getElementById("authViewModuleRows").innerHTML = permissions.map(permission => {
        const module = permissionModules.find(item => item.code === permission.code);
        return `
          <tr>
            <td>${escapeHtml(module?.code || permission.code)}</td>
            <td>${escapeHtml(module?.name || "-")}</td>
            <td>${escapeHtml(module?.parent || "-")}</td>
            <td><span class="badge ${authBadgeClass(permission.scope)}">${scopeModeText(permission.scope)}</span></td>
            <td>${escapeHtml(authScopeDetail(permission.scope))}</td>
          </tr>
        `;
      }).join("");
      setActiveSubmenu("authMenu");
      setPage("auth-view");
    }

    function updateAuthActiveLabel() {
      document.getElementById("authActiveLabel").textContent = document.getElementById("authActive").checked ? "Aktif" : "Tidak Aktif";
    }

    function buildAuthMultiSelect(id) {
      document.getElementById(id).innerHTML = `
        <button type="button" class="multi-field" onclick="toggleAuthMultiMenu('${id}')"></button>
        <div class="multi-menu">
          <input class="multi-search" type="text" placeholder="Cari..." oninput="renderAuthMultiSelect('${id}', this.value)" onclick="event.stopPropagation()">
          <div class="multi-options"></div>
        </div>
      `;
      renderAuthMultiSelect(id);
    }

    function renderAuthMultiSelect(id, query = "") {
      const select = authMultiSelects[id];
      const root = document.getElementById(id);
      const field = root.querySelector(".multi-field");
      const optionsBox = root.querySelector(".multi-options");
      field.innerHTML = select.values.length
        ? select.values.map(value => {
          const option = select.options.find(item => item.id === value);
          return `<span class="chip">${escapeHtml(option?.name || value)}<button type="button" onclick="removeAuthMultiValue(event, '${id}', ${value})">x</button></span>`;
        }).join("")
        : `<span class="multi-placeholder">${escapeHtml(select.placeholder)}</span>`;

      const visible = select.options.filter(option => option.name.toLowerCase().includes(query.trim().toLowerCase()));
      optionsBox.innerHTML = visible.length ? visible.map(option => `
        <button type="button" class="multi-option ${select.values.includes(option.id) ? "selected" : ""}" onclick="toggleAuthMultiValue('${id}', ${option.id})">
          <span>${escapeHtml(option.name)}</span><span>${select.values.includes(option.id) ? "✓" : ""}</span>
        </button>
      `).join("") : '<div class="multi-empty">Data tidak ditemukan</div>';
    }

    function toggleAuthMultiMenu(id) {
      const root = document.getElementById(id);
      const willOpen = !root.classList.contains("open");
      closeAuthMultiMenus();
      root.classList.toggle("open", willOpen);
      if (willOpen) {
        const search = root.querySelector(".multi-search");
        search.value = "";
        renderAuthMultiSelect(id);
        setTimeout(() => search.focus(), 0);
      }
    }

    function closeAuthMultiMenus() {
      document.querySelectorAll("#authScopeModal .multi-select.open").forEach(item => item.classList.remove("open"));
    }

    function toggleAuthMultiValue(id, value) {
      const select = authMultiSelects[id];
      if (select.values.includes(value)) select.values = select.values.filter(item => item !== value);
      else select.values.push(value);
      renderAuthMultiSelect(id, document.querySelector(`#${id} .multi-search`).value);
    }

    function removeAuthMultiValue(event, id, value) {
      event.stopPropagation();
      authMultiSelects[id].values = authMultiSelects[id].values.filter(item => item !== value);
      renderAuthMultiSelect(id);
    }

    function setAuthMultiValues(id, values) {
      authMultiSelects[id].values = [...values];
      renderAuthMultiSelect(id);
    }

    function getAuthMultiValues(id) {
      return [...authMultiSelects[id].values];
    }

    function uiScopeToData() {
      const modeText = document.getElementById("authScopeMode").value;
      if (modeText === "Semua Data") return emptyScope("ALL");
      if (modeText === "Data Sendiri") return emptyScope("OWN");
      const empMode = document.getElementById("authEmploymentMode").value;
      const deptMode = document.getElementById("authDepartmentMode").value;
      return filterScope(
        empMode,
        empMode === "SELECTED" ? getAuthMultiValues("authEmploymentSelect") : [],
        deptMode,
        deptMode === "SELECTED" ? getAuthMultiValues("authDepartmentSelect") : []
      );
    }

    function setScopeModalValues(scope) {
      document.getElementById("authScopeMode").value = scopeModeText(scope);
      document.getElementById("authEmploymentMode").value = scope.scope_employment_type_mode;
      document.getElementById("authDepartmentMode").value = scope.scope_department_mode;
      setAuthMultiValues("authEmploymentSelect", scope.scope_employment_type_ids);
      setAuthMultiValues("authDepartmentSelect", scope.scope_department_ids);
      updateAuthFilterVisibility();
    }

    function updateAuthFilterVisibility() {
      const filter = document.getElementById("authScopeMode").value === "Filter Data";
      document.getElementById("authFilterFields").classList.toggle("hidden", !filter);
      document.getElementById("authEmploymentSelect").classList.toggle("hidden", document.getElementById("authEmploymentMode").value !== "SELECTED" || !filter);
      document.getElementById("authDepartmentSelect").classList.toggle("hidden", document.getElementById("authDepartmentMode").value !== "SELECTED" || !filter);
    }

    function validateAuthScope(scope) {
      const errors = [];
      if (scope.scope_mode !== "FILTER") return errors;
      const typeMeaningful = scope.scope_employment_type_mode === "ALL" || scope.scope_employment_type_mode === "SELECTED";
      const deptMeaningful = scope.scope_department_mode === "ALL" || scope.scope_department_mode === "SELECTED";
      if (!typeMeaningful && !deptMeaningful) errors.push("Filter Data harus memiliki minimal satu filter bermakna.");
      if (scope.scope_employment_type_mode === "SELECTED" && !scope.scope_employment_type_ids.length) errors.push("Pilih minimal 1 tipe karyawan.");
      if (scope.scope_department_mode === "SELECTED" && !scope.scope_department_ids.length) errors.push("Pilih minimal 1 departemen.");
      return errors;
    }

    function openAuthScopeModal(scopeMode, code) {
      authScopeMode = scopeMode;
      activeAuthModuleCode = code || null;
      authScopeErrors.classList.remove("show");
      let scope = pendingAuthBulkScope || emptyScope("ALL");
      if (scopeMode === "single") {
        const module = currentAuthModules.find(item => item.code === code);
        document.getElementById("authScopeModuleName").textContent = module.name;
        scope = module.scope;
      } else {
        document.getElementById("authScopeModuleName").textContent = "Scope massal";
      }
      setScopeModalValues(scope);
      authScopeModal.classList.add("show");
    }

    function closeAuthScopeModal() {
      authScopeModal.classList.remove("show");
    }

    function saveAuthScope() {
      const scope = uiScopeToData();
      const errors = validateAuthScope(scope);
      showAuthErrors(authScopeErrors, errors);
      if (errors.length) return;
      if (authScopeMode === "single") {
        const module = currentAuthModules.find(item => item.code === activeAuthModuleCode);
        module.scope = copyAuthScope(scope);
        renderAuthModules();
      } else {
        pendingAuthBulkScope = copyAuthScope(scope);
        document.getElementById("authBulkHint").textContent = `Scope siap diterapkan: ${authScopeDetail(scope)}`;
      }
      closeAuthScopeModal();
    }

    function renderAuthTargets() {
      const q = document.getElementById("authTargetSearch").value.trim().toLowerCase();
      const rows = currentAuthModules
        .filter(module => module.checked)
        .filter(module => `${module.code} ${module.name} ${module.parent}`.toLowerCase().includes(q));
      document.getElementById("authTargetRows").innerHTML = rows.map(module => `
        <tr>
          <td><input type="checkbox" class="auth-target-check" value="${module.code}" ${authTargetSelectedCodes.includes(module.code) ? "checked" : ""} onchange="toggleAuthTarget('${module.code}', this.checked)"></td>
          <td>${escapeHtml(module.code)}</td>
          <td>${escapeHtml(module.name)}</td>
          <td>${escapeHtml(module.parent)}</td>
          <td><span class="badge ${authBadgeClass(module.scope)}">${scopeModeText(module.scope)}</span></td>
        </tr>
      `).join("");
      document.getElementById("authTargetCheckAll").checked = rows.length > 0 && rows.every(module => authTargetSelectedCodes.includes(module.code));
    }

    function openAuthTargetModal() {
      const errors = [];
      if (!pendingAuthBulkScope) errors.push("Klik Set Scope Data terlebih dahulu.");
      if (!currentAuthModules.some(module => module.checked)) errors.push("Aktifkan minimal 1 module terlebih dahulu.");
      showAuthErrors(authFormErrors, errors);
      if (errors.length) return;

      authTargetSelectedCodes = [];
      document.getElementById("authTargetSearch").value = "";
      document.getElementById("authTargetScopeSummary").textContent = authScopeDetail(pendingAuthBulkScope);
      authTargetErrors.classList.remove("show");
      renderAuthTargets();

      authTargetModal.classList.add("show");
    }

    function closeAuthTargetModal() {
      authTargetModal.classList.remove("show");
    }

    function toggleAuthTarget(code, checked) {
      if (checked && !authTargetSelectedCodes.includes(code)) authTargetSelectedCodes.push(code);
      if (!checked) authTargetSelectedCodes = authTargetSelectedCodes.filter(item => item !== code);
      renderAuthTargets();
    }

    function applyAuthBulkScope() {
      const errors = [];
      if (!authTargetSelectedCodes.length) errors.push("Pilih minimal 1 module target.");
      showAuthErrors(authTargetErrors, errors);
      if (errors.length) return;
      currentAuthModules.forEach(module => {
        if (authTargetSelectedCodes.includes(module.code)) module.scope = copyAuthScope(pendingAuthBulkScope);
      });
      closeAuthTargetModal();
      renderAuthModules();
      showToast("Scope data berhasil diterapkan.");
    }

    function openDeleteAuth(code) {
      const role = authRoles.find(item => item.code === code);
      if (!role) return;
      deleteAuthCode = code;
      deleteAuthErrors.classList.remove("show");
      document.getElementById("deleteAuthMessage").textContent = `Apakah Anda yakin ingin menghapus Role ${role.name || role.code || "ini"}?`;
      deleteAuthModal.classList.add("show");
    }

    function closeDeleteAuth() {
      deleteAuthModal.classList.remove("show");
      deleteAuthCode = null;
    }

    function confirmDeleteAuth() {
      const targetCode = String(deleteAuthCode || "");
      const role = authRoles.find(item => item.code === targetCode);
      if (!role) {
        console.warn("Role: target hapus tidak ditemukan.", { code: deleteAuthCode, total: authRoles.length });
        return;
      }
      if (role.used_by_user) {
        showAuthErrors(deleteAuthErrors, ["Role sedang digunakan oleh pengguna. Silakan hubungi administrator untuk menghapus role tersebut."]);
        return;
      }
      const before = authRoles.length;
      authRoles = authRoles.filter(item => item.code !== targetCode);
      if (authRoles.length === before) {
        console.warn("Role: data tidak terhapus.", { code: targetCode, before, after: authRoles.length });
        return;
      }
      delete authPermissions[targetCode];
      closeDeleteAuth();
      openAuthList();
      showToast("Data berhasil dihapus.");
    }

    function renderList() {
      const q = document.getElementById("searchBox").value.trim().toLowerCase();
      const rows = companies.filter(company => {
        const matchesSearch = [
          company.company_code,
          company.company_name,
          company.city,
          company.country
        ].join(" ").toLowerCase().includes(q);
        return matchesSearch;
      });

      document.getElementById("companyRows").innerHTML = rows.map(company => `
        <tr>
          <td>${escapeHtml(company.company_code)}</td>
          <td>${escapeHtml(company.company_name)}</td>
          <td>${escapeHtml(company.city)}</td>
          <td>${escapeHtml(company.country)}</td>
          <td>${escapeHtml(company.currency_code)}</td>
          <td>${statusBadge(company)}</td>
          <td class="action-cell">
            <div class="actions inline-actions">
              <button class="btn teal small icon-btn" type="button" title="Lihat" aria-label="Lihat" data-module-action="openDetail" data-module-args="${company.id}">${window.iconEye()}</button>
              <button class="btn small icon-btn" type="button" title="Ubah" aria-label="Ubah" data-module-action="openEdit" data-module-args="${company.id}">${window.iconPencil()}</button>
              <button class="btn red small icon-btn" type="button" title="Hapus" aria-label="Hapus" data-module-action="openDelete" data-module-args="${company.id}">${window.iconTrash()}</button>
            </div>
          </td>
        </tr>
      `).join("");

      document.getElementById("emptyState").classList.toggle("hidden", rows.length > 0);
      const shown = rows.length ? `1 - ${rows.length}` : "0 - 0";
      document.getElementById("pageInfo").textContent = `Menampilkan ${shown} dari ${rows.length} data`;
      setPage("list");
    }

    function fillForm(company) {
      document.getElementById("companyCode").value = company?.company_code || "";
      document.getElementById("companyName").value = company?.company_name || "";
      document.getElementById("currencyCode").value = company?.currency_code || "IDR";
      document.getElementById("isActive").checked = company ? company.is_active : true;
      document.getElementById("street").value = company?.street || "";
      document.getElementById("city").value = company?.city || "";
      document.getElementById("state").value = company?.state || "";
      document.getElementById("zipCode").value = company?.zip_code || "";
      document.getElementById("country").value = company?.country || "Indonesia";
      document.getElementById("phone").value = company?.phone || "";
      document.getElementById("email").value = company?.email || "";
      document.getElementById("website").value = company?.website || "";
      document.getElementById("npwp").value = company?.npwp || "";
      uploadedLogo = company?.logo || "";
      updateActiveLabel();
      updateLogoPreview(company);
      showErrors([]);
    }

    function openCreate() {
      editingId = null;
      document.getElementById("saveBtn").textContent = "Simpan";
      document.getElementById("codeHelper").textContent = "Kode perusahaan harus unik.";
      fillForm(null);
      setPage("create");
    }

    function openEdit(id) {
      const company = companies.find(item => item.id === id);
      if (!company) return;
      editingId = id;
      selectedId = id;
      document.getElementById("saveBtn").textContent = "Simpan";
      document.getElementById("codeHelper").textContent = "Kode Perusahaan tetap bisa diedit, tetapi kode harus unik.";
      fillForm(company);
      setPage("edit");
    }

    function readForm() {
      return {
        company_code: document.getElementById("companyCode").value.trim().toUpperCase(),
        company_name: document.getElementById("companyName").value.trim(),
        currency_code: document.getElementById("currencyCode").value,
        is_active: document.getElementById("isActive").checked,
        street: document.getElementById("street").value.trim(),
        city: document.getElementById("city").value.trim(),
        state: document.getElementById("state").value.trim(),
        zip_code: document.getElementById("zipCode").value.trim(),
        country: document.getElementById("country").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        website: document.getElementById("website").value.trim(),
        npwp: document.getElementById("npwp").value.trim(),
        logo: uploadedLogo
      };
    }

    function validateForm(data) {
      const errors = [];
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!data.company_code) errors.push("Kode Perusahaan wajib diisi.");
      if (!data.company_name) errors.push("Nama Perusahaan wajib diisi.");
      if (!data.currency_code) errors.push("Mata Uang wajib diisi.");
      if (data.email && !emailPattern.test(data.email)) errors.push("Format Email tidak valid.");
      if (data.company_code && companies.some(item => item.company_code.toLowerCase() === data.company_code.toLowerCase() && item.id !== editingId)) {
        errors.push("Kode Perusahaan sudah digunakan. Gunakan kode lain.");
      }
      showErrors(errors);
      return !errors.length;
    }

    function saveForm() {
      const data = readForm();
      if (!validateForm(data)) return;

      if (editingId) {
        const targetId = Number(editingId);
        const company = companies.find(item => item.id === targetId);
        if (!company) {
          console.warn("Perusahaan: data yang akan diubah tidak ditemukan.", { id: editingId });
          return;
        }
        Object.assign(company, data, {
          updated_at: "2026-07-08 15:30",
          updated_by: "100"
        });
        selectedId = targetId;
        editingId = null;
        renderList();
        showToast("Data berhasil diperbarui.");
        return;
      }

      const nextId = Math.max(...companies.map(item => item.id)) + 1;
      const newCompany = {
        id: nextId,
        ...data,
        created_at: "2026-07-08 15:30",
        created_by: "100",
        updated_at: "2026-07-08 15:30",
        updated_by: "100"
      };
      companies.unshift(newCompany);
      selectedId = nextId;
      editingId = null;
      renderList();
      showToast("Data berhasil ditambahkan.");
    }

    function infoRow(label, value) {
      return `
        <div class="info-row">
          <div class="info-label">${escapeHtml(label)}</div>
          <div>${value ? escapeHtml(value) : "-"}</div>
        </div>
      `;
    }

    function openDetail(id) {
      const company = companies.find(item => item.id === id);
      if (!company) return;
      selectedId = id;
      document.getElementById("detailCompanyCodeInput").value = company.company_code;
      document.getElementById("detailCompanyNameInput").value = company.company_name;
      document.getElementById("detailCurrency").value = company.currency_code;
      document.getElementById("detailStatusInput").value = company.is_active ? "Aktif" : "Tidak Aktif";
      document.getElementById("detailStreet").value = company.street;
      document.getElementById("detailCity").value = company.city;
      document.getElementById("detailState").value = company.state;
      document.getElementById("detailZip").value = company.zip_code;
      document.getElementById("detailCountry").value = company.country;
      document.getElementById("detailPhone").value = company.phone;
      document.getElementById("detailEmail").value = company.email;
      document.getElementById("detailWebsite").value = company.website;
      document.getElementById("detailNpwp").value = company.npwp;
      document.getElementById("detailLogo").innerHTML = logoContent(company);
      setPage("detail");
    }

    function openDelete(id) {
      const company = companies.find(item => item.id === id);
      if (!company) return;
      deleteId = id;
      document.getElementById("deleteMessage").textContent = `Apakah Anda yakin ingin menghapus Perusahaan ${company.company_code} - ${company.company_name}?`;
      deleteModal.classList.add("show");
    }

    function closeDelete() {
      deleteModal.classList.remove("show");
      deleteId = null;
    }

    function confirmDelete() {
      if (!deleteId) return;
      const targetId = Number(deleteId);
      const before = companies.length;
      companies = companies.filter(item => item.id !== targetId);
      if (companies.length === before) {
        console.warn("Perusahaan: target hapus tidak ditemukan.", { id: deleteId, before, after: companies.length });
        return;
      }
      closeDelete();
      renderList();
      showToast("Data berhasil dihapus.");
    }

    function updateActiveLabel() {
      document.getElementById("activeLabel").textContent = document.getElementById("isActive").checked ? "Aktif" : "Tidak Aktif";
    }

    function updateLogoPreview(company) {
      const preview = document.getElementById("logoPreview");
      preview.innerHTML = company ? logoContent(company) : "LOGO";
      document.getElementById("logoInput").value = "";
    }

    document.getElementById("addBtn").addEventListener("click", openCreate);
    document.getElementById("cancelBtn").addEventListener("click", renderList);
    document.getElementById("saveBtn").addEventListener("click", saveForm);
    document.getElementById("backBtn").addEventListener("click", renderList);
    document.getElementById("searchBox").addEventListener("input", renderList);
    document.getElementById("userAddBtn").addEventListener("click", openUserCreate);
    document.getElementById("userBackBtn").addEventListener("click", openUserList);
    document.getElementById("userViewBackBtn").addEventListener("click", openUserList);
    document.getElementById("userSaveBtn").addEventListener("click", saveUserForm);
    document.getElementById("userSearchBox").addEventListener("input", renderUsers);
    document.getElementById("userStatusFilter").addEventListener("change", renderUsers);
    document.getElementById("userTypeFilter").addEventListener("change", renderUsers);
    document.getElementById("userPageSize").addEventListener("change", renderUsers);
    document.getElementById("userActive").addEventListener("change", updateUserActiveLabel);
    document.getElementById("userResetPasswordBtn").addEventListener("click", openUserResetPasswordModal);
    document.getElementById("userAddAccessBtn").addEventListener("click", () => openUserAccessModal());
    document.getElementById("userAccessDefault").addEventListener("change", updateUserAccessDefaultLabel);
    document.getElementById("userAccessSaveBtn").addEventListener("click", saveUserAccess);
    document.getElementById("userAccessCancelBtn").addEventListener("click", closeUserAccessModal);
    document.getElementById("userResetPasswordSaveBtn").addEventListener("click", saveUserResetPassword);
    document.getElementById("userResetPasswordCancelBtn").addEventListener("click", closeUserResetPasswordModal);
    document.getElementById("moduleSearchBox").addEventListener("input", renderModules);
    document.getElementById("modulePageSize").addEventListener("change", renderModules);
    document.getElementById("moduleAddBtn").addEventListener("click", openModuleCreate);
    document.getElementById("moduleBackBtn").addEventListener("click", openModulePage);
    document.getElementById("moduleViewBackBtn").addEventListener("click", openModulePage);
    document.getElementById("moduleSaveBtn").addEventListener("click", saveModuleForm);
    document.getElementById("authAddBtn").addEventListener("click", openAuthCreate);
    document.getElementById("authBackBtn").addEventListener("click", openAuthList);
    document.getElementById("authViewBackBtn").addEventListener("click", openAuthList);
    document.getElementById("authSaveBtn").addEventListener("click", saveAuthForm);
    document.getElementById("authSearchBox").addEventListener("input", renderAuthList);
    document.getElementById("authPageSize").addEventListener("change", renderAuthList);
    document.getElementById("authActive").addEventListener("change", updateAuthActiveLabel);
    document.getElementById("authCheckAll").addEventListener("change", event => {
      currentAuthModules.forEach(module => module.checked = event.target.checked);
      renderAuthModules();
    });
    document.getElementById("authBulkScopeBtn").addEventListener("click", () => openAuthScopeModal("bulk"));
    document.getElementById("authApplyBulkBtn").addEventListener("click", openAuthTargetModal);
    document.getElementById("authScopeMode").addEventListener("change", updateAuthFilterVisibility);
    document.getElementById("authEmploymentMode").addEventListener("change", updateAuthFilterVisibility);
    document.getElementById("authDepartmentMode").addEventListener("change", updateAuthFilterVisibility);
    document.getElementById("authSaveScopeBtn").addEventListener("click", saveAuthScope);
    document.getElementById("authCancelScopeBtn").addEventListener("click", closeAuthScopeModal);
    document.getElementById("authTargetSearch").addEventListener("input", renderAuthTargets);
    document.getElementById("authTargetCheckAll").addEventListener("change", event => {
      const visibleCodes = [...document.querySelectorAll(".auth-target-check")].map(item => item.value);
      if (event.target.checked) authTargetSelectedCodes = [...new Set([...authTargetSelectedCodes, ...visibleCodes])];
      else authTargetSelectedCodes = authTargetSelectedCodes.filter(code => !visibleCodes.includes(code));
      renderAuthTargets();
    });
    document.getElementById("authApplyTargetBtn").addEventListener("click", applyAuthBulkScope);
    document.getElementById("authCancelTargetBtn").addEventListener("click", closeAuthTargetModal);
    document.getElementById("isActive").addEventListener("change", updateActiveLabel);
    document.getElementById("companyCode").addEventListener("input", event => {
      event.target.value = event.target.value.toUpperCase().replace(/\s+/g, "");
    });
    document.getElementById("logoInput").addEventListener("change", event => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        uploadedLogo = reader.result;
        document.getElementById("logoPreview").innerHTML = `<img src="${uploadedLogo}" alt="Preview logo">`;
      };
      reader.readAsDataURL(file);
    });
    document.getElementById("cancelDeleteBtn").addEventListener("click", closeDelete);
    document.getElementById("confirmDeleteBtn").addEventListener("click", confirmDelete);
    document.getElementById("cancelDeleteUserBtn").addEventListener("click", closeDeleteUser);
    document.getElementById("confirmDeleteUserBtn").addEventListener("click", confirmDeleteUser);
    document.getElementById("cancelDeleteModuleBtn").addEventListener("click", closeDeleteModule);
    document.getElementById("confirmDeleteModuleBtn").addEventListener("click", confirmDeleteModule);
    document.getElementById("cancelDeleteAuthBtn").addEventListener("click", closeDeleteAuth);
    document.getElementById("confirmDeleteAuthBtn").addEventListener("click", confirmDeleteAuth);
    deleteModal.addEventListener("click", event => {
      if (event.target === deleteModal) closeDelete();
    });
    deleteModuleModal.addEventListener("click", event => {
      if (event.target === deleteModuleModal) closeDeleteModule();
    });
    userAccessModal.addEventListener("click", event => {
      if (event.target === userAccessModal) closeUserAccessModal();
    });
    userResetPasswordModal.addEventListener("click", event => {
      if (event.target === userResetPasswordModal) closeUserResetPasswordModal();
    });
    deleteUserModal.addEventListener("click", event => {
      if (event.target === deleteUserModal) closeDeleteUser();
    });
    authScopeModal.addEventListener("click", event => {
      if (event.target === authScopeModal) closeAuthScopeModal();
    });
    authTargetModal.addEventListener("click", event => {
      if (event.target === authTargetModal) closeAuthTargetModal();
    });
    deleteAuthModal.addEventListener("click", event => {
      if (event.target === deleteAuthModal) closeDeleteAuth();
    });
    document.addEventListener("click", event => {
      if (!event.target.closest("#authScopeModal .multi-select")) closeAuthMultiMenus();
    });

    buildAuthMultiSelect("authEmploymentSelect");
    buildAuthMultiSelect("authDepartmentSelect");
    buildAuthPermissions();
    renderList();
  </script>
</template>

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value + "T00:00:00");
      const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
      return `${String(date.getDate()).padStart(2, "0")}-${months[date.getMonth()]}-${date.getFullYear()}`;
    }

    function copyValues(values) {
      return values.map(item => ({ date: item.date, value: item.value }));

    function showErrors(box, errors) {

      box.innerHTML = errors.map(error => `<div>${escapeHtml(error)}</div>`).join("");
      box.classList.add("show");
    }

    function validateForm() {
      const name = document.getElementById("paramName").value.trim();
      const code = document.getElementById("paramCode").value.trim();
      const errors = [];
      if (!name) errors.push("Nama Aturan Parameter wajib diisi.");
      if (!code) errors.push("Kode Aturan Parameter wajib diisi.");
      if (parameters.some(item => item.name.toLowerCase() === name.toLowerCase() && item.code !== editingCode)) {
        errors.push("Nama Aturan Parameter tidak boleh duplikat.");
      }
      if (parameters.some(item => item.code.toLowerCase() === code.toLowerCase() && item.code !== editingCode)) {
        errors.push("Kode Aturan Parameter tidak boleh duplikat.");
      }
      if (!formValues.length) errors.push("Detail value tidak boleh kosong.");
      showErrors(formErrors, errors);
      return { valid: !errors.length, name, code };
    }

    function saveForm() {
      const result = validateForm();
      if (!result.valid) return;

      const isEdit = Boolean(editingCode);
      if (isEdit) {
        const item = parameters.find(param => param.code === editingCode);
        if (!item) {
          console.warn("Aturan Parameter: data yang akan diubah tidak ditemukan.", { code: editingCode });
          return;
        }
        item.name = result.name;
        item.code = result.code;
        item.values = copyValues(formValues);
      } else {
        parameters.push({ name: result.name, code: result.code, values: copyValues(formValues) });
      }

      editingCode = null;
      renderList();
      showToast(isEdit ? "Data berhasil diperbarui." : "Data berhasil ditambahkan.");
    }

    function validateValue() {
      const date = document.getElementById("valueDate").value;
      const value = document.getElementById("valueAmount").value.trim();
      const errors = [];
      if (!date) errors.push("Tanggal Mulai wajib diisi.");
      if (!value) errors.push("Nilai wajib diisi.");
      if (date && formValues.some(item => item.date === date)) {
        errors.push("Tanggal Mulai tidak boleh duplikat dalam parameter yang sama.");
      }
      showErrors(valueErrors, errors);
      return { valid: !errors.length, date, value };
    }

    function saveValue(closeAfterSave) {
      const result = validateValue();
      if (!result.valid) return;
      formValues.push({ date: result.date, value: result.value });
      formValues.sort((a, b) => a.date.localeCompare(b.date));
      renderValueRows(false);
      if (closeAfterSave) {
        closeValueModal();
      } else {
        document.getElementById("valueDate").value = "";
        document.getElementById("valueAmount").value = "";
        valueErrors.classList.remove("show");
        document.getElementById("valueDate").focus();
      }
    }

    function closeDelete() {
      deleteType = "parameter";

      document.getElementById("cancelDeleteBtn").textContent = "Tidak";
      deleteModal.classList.remove("show");
    }

    function confirmDeleted(label, target, before, after) {
      if (after < before) return true;
      console.warn(`${label}: target hapus tidak ditemukan.`, { target, before, after });
      return false;
    }

    function confirmDelete() {
      if (deleteType === "approval-stage") {
        const before = approvalStages.length;
        approvalStages = approvalStages.filter(item => item.code !== deleteCode);
        if (!confirmDeleted("Tahap Approval", deleteCode, before, approvalStages.length)) return;
        closeDelete();
        renderApprovalStageList();
        showToast("Data berhasil dihapus.");
        return;
      }

      if (deleteType === "employment-type") {
        const before = employmentTypes.length;
        employmentTypes = employmentTypes.filter(item => item.name !== deleteCode);
        if (!confirmDeleted("Tipe Karyawan", deleteCode, before, employmentTypes.length)) return;
        closeDelete();
        renderEmploymentTypeList();
        showToast("Data berhasil dihapus.");
        return;
      }

      if (deleteType === "application-stage") {
        const targetSequence = Number(deleteCode);
        const before = applicationStages.length;
        applicationStages = applicationStages.filter(item => Number(item.sequence) !== targetSequence);
        if (!confirmDeleted("Tahap Lamaran", targetSequence, before, applicationStages.length)) return;
        closeDelete();
        renderApplicationStageList();
        showToast("Data berhasil dihapus.");
        return;
      }

      if (deleteType === "work-type") {
        const needle = `workEntries["${deleteCode}"]`;
        const usedInFormula = components.some(item => item.formula.includes(needle));
        if (usedInFormula) {
          showErrors(deleteErrors, ["Tipe Waktu Kerja tidak dapat dihapus karena masih digunakan pada formula Komponen Gaji."]);
          return;
        }
        const before = workTypes.length;
        workTypes = workTypes.filter(item => item.code !== deleteCode);
        if (!confirmDeleted("Tipe Waktu Kerja", deleteCode, before, workTypes.length)) return;
        closeDelete();
        renderWorkTypeList();
        showToast("Data berhasil dihapus.");
        return;
      }

      if (deleteType === "input-type") {
        const needle = `inputs["${deleteCode}"]`;
        const usedInFormula = components.some(item => item.formula.includes(needle));
        if (usedInFormula) {
          showErrors(deleteErrors, ["Tipe Input Komponen Gaji tidak dapat dihapus karena masih digunakan pada formula Komponen Gaji."]);
          return;
        }
        const before = inputTypes.length;
        inputTypes = inputTypes.filter(item => item.code !== deleteCode);
        if (!confirmDeleted("Tipe Input Komponen Gaji", deleteCode, before, inputTypes.length)) return;
        closeDelete();
        renderInputTypeList();
        showToast("Data berhasil dihapus.");
        return;
      }

      if (deleteType === "structure") {
        const before = structures.length;
        structures = structures.filter(item => item.code !== deleteCode);
        if (!confirmDeleted("Struktur Gaji", deleteCode, before, structures.length)) return;
        closeDelete();
        renderStructureList();
        showToast("Data berhasil dihapus.");
        return;
      }

      if (deleteType === "component") {
        const needle = `components["${deleteCode}"].amount`;
        const usedInFormula = components.some(item => item.code !== deleteCode && item.formula.includes(needle));
        if (usedInFormula) {
          showErrors(deleteErrors, ["Komponen Gaji tidak dapat dihapus karena masih digunakan pada formula Komponen Gaji lain."]);
          return;
        }
        const before = components.length;
        components = components.filter(item => item.code !== deleteCode);
        if (!confirmDeleted("Komponen Gaji", deleteCode, before, components.length)) return;
        closeDelete();
        renderComponentList();
        showToast("Data berhasil dihapus.");
        return;
      }

      if (deleteType === "category") {
        const usedAsParent = categories.some(item => item.parent === deleteCode);
        if (usedAsParent) {
          showErrors(deleteErrors, ["Kategori Komponen Gaji tidak dapat dihapus karena masih digunakan sebagai Parent."]);
          return;
        }
        const before = categories.length;
        categories = categories.filter(item => item.code !== deleteCode);
        if (!confirmDeleted("Kategori Komponen Gaji", deleteCode, before, categories.length)) return;
        closeDelete();
        renderCategoryList();
        showToast("Data berhasil dihapus.");
        return;
      }

      const before = parameters.length;
      parameters = parameters.filter(item => item.code !== deleteCode);
      if (!confirmDeleted("Aturan Parameter", deleteCode, before, parameters.length)) return;
      closeDelete();
      renderList();
      showToast("Data berhasil dihapus.");
    }

        const text = [
          stage.code,
          stage.name,
          approvalStageTypeLabel(stage.approver_type),
          approvalStageDetailSummary(stage),
          stage.is_active ? "Aktif" : "Tidak Aktif"
        ].join(" ").toLowerCase();
        const statusMatch = status === "all"
          || (status === "active" && stage.is_active)
          || (status === "inactive" && !stage.is_active);
        return text.includes(query) && statusMatch;
      });
      const visibleRows = rows.slice(0, pageSize);

      document.getElementById("approvalStageRows").innerHTML = visibleRows.map(stage => `
        <tr>
          <td>${escapeHtml(stage.code)}</td>

    function validateApprovalStageForm() {
      const code = document.getElementById("approvalStageCode").value.trim().toUpperCase().replace(/\s+/g, "_");
      const name = document.getElementById("approvalStageName").value.trim();
      const approverType = document.getElementById("approvalStageType").value;
      const description = document.getElementById("approvalStageDescription").value.trim();
      const isActive = document.getElementById("approvalStageActive").checked;
      document.getElementById("approvalStageCode").value = code;
      const errors = [];
      if (!code) errors.push("Kode Tahap wajib diisi.");
      if (!name) errors.push("Nama Tahap wajib diisi.");
      if (!approverType) errors.push("Tipe Approver wajib dipilih.");
      if (code && approvalStages.some(item => item.code.toLowerCase() === code.toLowerCase() && item.code !== approvalStageEditingCode)) errors.push("Kode Tahap tidak boleh duplikat.");
      if (name && approvalStages.some(item => item.name.toLowerCase() === name.toLowerCase() && item.code !== approvalStageEditingCode)) errors.push("Nama Tahap tidak boleh duplikat.");
      if (approverType === "ROLE" || approverType === "USER") {
        if (!approvalStageDetailRows.length) errors.push(`${approvalStageTypeLabel(approverType)} Approver wajib memiliki minimal 1 detail.`);
        const values = new Set();
        approvalStageDetailRows.forEach(row => {
          if (!row.value) errors.push(`${approvalStageTypeLabel(approverType)} wajib dipilih.`);
          if (row.value && values.has(row.value)) errors.push(`${approvalStageTypeLabel(approverType)} tidak boleh duplikat.`);
          values.add(row.value);
        });
      }
      showErrors(approvalStageFormErrors, [...new Set(errors)]);
      return {
        valid: !errors.length,
        code,
        name,
        approver_type: approverType,
        description,
        is_active: isActive,
        details: approverType === "DIRECT_MANAGER" ? [] : approvalStageDetailRows.map(item => ({ ...item }))
      };
    }

    function saveApprovalStageForm() {

      if (!result.valid) return;
      const payload = {
        code: result.code,
        name: result.name,
        approver_type: result.approver_type,
        description: result.description,
        is_active: result.is_active,
        details: result.details
      };

      const isEdit = Boolean(approvalStageEditingCode);
      if (isEdit) {
        const index = approvalStages.findIndex(item => item.code === approvalStageEditingCode);
        if (index < 0) {
          console.warn("Tahap Approval: data yang akan diubah tidak ditemukan.", { code: approvalStageEditingCode });

    function validateStructureForm() {
      const code = document.getElementById("structureCode").value.trim().toUpperCase().replace(/\s+/g, "_");
      const name = document.getElementById("structureName").value.trim();
      const period = document.getElementById("structurePeriod").value;
      const active = document.getElementById("structureActive").checked;
      document.getElementById("structureCode").value = code;
      const errors = [];
      if (!code) errors.push("Kode Struktur Gaji wajib diisi.");
      if (!name) errors.push("Nama Struktur Gaji wajib diisi.");
      if (!period) errors.push("Tipe Periode wajib dipilih.");
      if (structures.some(item => item.code.toLowerCase() === code.toLowerCase() && item.code !== structureEditingCode)) errors.push("Kode Struktur Gaji tidak boleh duplikat.");
      if (structures.some(item => item.name.toLowerCase() === name.toLowerCase() && item.code !== structureEditingCode)) errors.push("Nama Struktur Gaji tidak boleh duplikat.");
      if (!structureComponents.length) errors.push("Minimal harus ada 1 Detail Komponen Gaji.");
      const sequences = new Set();
      const componentCodes = new Set();
      structureComponents.forEach(item => {
        if (!item.sequence || Number(item.sequence) <= 0) errors.push("Urutan harus angka lebih besar dari 0.");
        if (sequences.has(String(item.sequence))) errors.push("Urutan tidak boleh duplikat dalam struktur yang sama.");
        sequences.add(String(item.sequence));
        if (!item.component) errors.push("Komponen Gaji pada Detail Komponen Gaji wajib dipilih.");
        if (componentCodes.has(item.component)) errors.push("Komponen Gaji tidak boleh duplikat dalam struktur yang sama.");
        componentCodes.add(item.component);
        if (!item.label) errors.push("Nama Tampilan wajib diisi.");
      });
      const inputs = new Set();
      structureInputs.forEach(codeValue => {
        if (inputs.has(codeValue)) errors.push("Tipe Input Komponen Gaji tidak boleh duplikat dalam struktur yang sama.");
        inputs.add(codeValue);
      });
      showErrors(structureFormErrors, [...new Set(errors)]);
      return { valid: !errors.length, code, name, period, active };
    }

    function saveStructureForm() {
      const result = validateStructureForm();
      if (!result.valid) return;
      const payload = {
        code: result.code,
        name: result.name,

        active: result.active,
        components: structureComponents.map(item => ({ ...item })),
        inputs: structureInputs.slice()
      };
      const isEdit = Boolean(structureEditingCode);
      if (isEdit) {
        const index = structures.findIndex(item => item.code === structureEditingCode);
        if (index < 0) {
          console.warn("Struktur Gaji: data yang akan diubah tidak ditemukan.", { code: structureEditingCode });
          return;
        }
        structures[index] = payload;
      } else {
        structures.push(payload);
      }
      structureEditingCode = null;
      renderStructureList();
      showToast(isEdit ? "Data berhasil diperbarui." : "Data berhasil ditambahkan.");
    }

    function categoryHasParentCycle(code, parent) {
      let current = parent;
      const parentByCode = {};
      categories.forEach(item => {
        const itemCode = item.code === categoryEditingCode ? code : item.code;
        const itemParent = item.code === categoryEditingCode
          ? parent
          : item.parent === categoryEditingCode ? code : item.parent;
        parentByCode[itemCode] = itemParent;
      });
      const visited = new Set([code]);
      while (current) {
        if (visited.has(current)) return true;
        visited.add(current);
        current = parentByCode[current] || "";
      }
      return false;
    }

      if (categories.some(item => item.code.toLowerCase() === code.toLowerCase() && item.code !== categoryEditingCode)) {
        errors.push("Kode tidak boleh duplikat.");

      if (categories.some(item => item.name.toLowerCase() === name.toLowerCase() && item.code !== categoryEditingCode)) {
        errors.push("Nama kategori tidak boleh duplikat.");
      }
      if (parent && parent === code) errors.push("Parent tidak boleh sama dengan kategori itu sendiri.");
      if (parent && categoryHasParentCycle(code, parent)) errors.push("Parent tidak boleh membentuk cycle kategori.");

    function insertFormulaToken(token) {
      if (mode === "component-view") return;
      const input = document.getElementById("componentFormula");
      const start = input.selectionStart || input.value.length;
      const end = input.selectionEnd || input.value.length;
      const prefix = input.value.slice(0, start);
      const suffix = input.value.slice(end);
      const spacer = prefix && !/\s$/.test(prefix) ? " " : "";
      input.value = `${prefix}${spacer}${token}${suffix}`;
      input.focus();
      const cursor = prefix.length + spacer.length + token.length;
      input.setSelectionRange(cursor, cursor);
    }

    function validateComponentForm() {
      const code = document.getElementById("componentCode").value.trim();
      const name = document.getElementById("componentName").value.trim();
      const category = document.getElementById("componentCategory").value;
      const formula = document.getElementById("componentFormula").value.trim();
      const active = document.getElementById("componentActive").checked;
      const errors = [];
      const oldSyntax = /work_entries|result\s*=|localdict/i;
      const sqlSyntax = /\b(SELECT|INSERT|UPDATE|DELETE|DROP|FROM|JOIN|WHERE)\b/i;

      if (!code) errors.push("Kode Komponen Gaji wajib diisi.");
      if (!name) errors.push("Nama Komponen Gaji wajib diisi.");
      if (!category) errors.push("Kategori Komponen Gaji wajib dipilih.");
      if (!formula) errors.push("Formula wajib diisi.");
      if (components.some(item => item.code.toLowerCase() === code.toLowerCase() && item.code !== componentEditingCode)) {
        errors.push("Kode tidak boleh duplikat.");
      }
      if (components.some(item => item.name.toLowerCase() === name.toLowerCase() && item.code !== componentEditingCode)) {
        errors.push("Nama komponen gaji tidak boleh duplikat.");
      }
      if (formula && oldSyntax.test(formula)) errors.push("Formula harus menggunakan format Java-friendly expression.");
      if (formula && sqlSyntax.test(formula)) errors.push("Formula tidak boleh menggunakan query database langsung.");

      showErrors(componentFormErrors, errors);
      return { valid: !errors.length, code, name, category, formula, active };
