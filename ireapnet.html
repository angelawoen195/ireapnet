    let filterSelections = { department: "", position: "", employee: "" };
    const lookupData = {
      department: [
        { code: "FIN", name: "Finance" },
        { code: "PRD", name: "Produksi" },
        { code: "HRD", name: "HRD" }
      ],
      position: [
        { code: "STAFF_FIN", name: "Staff Finance" },
        { code: "OPR", name: "Operator" },
        { code: "HR_STAFF", name: "HR Staff" }
      ],
      employee: [
        { code: "EMP001", name: "Andi Wijaya" },
        { code: "EMP002", name: "Budi Santoso" },
        { code: "EMP003", name: "Citra Lestari" }
      ]
    };
    let payrollRuns = [
      makeRun("RUN001", "STAFF_MONTHLY - Juli 2026", "STAFF_MONTHLY", "2026-07-01", "2026-07-31", "Terkonfirmasi", 3),
      makeRun("RUN002", "HARIAN_WEEKLY - 03 Jul 2026", "HARIAN_WEEKLY", "2026-07-03", "2026-07-09", "Selesai", 5),
      makeRun("RUN003", "STAFF_MONTHLY - Juni 2026", "STAFF_MONTHLY", "2026-06-01", "2026-06-30", "Terbayar", 3)
    ];
    payrollRuns[0].slips[2].status = "Selesai";
    const standaloneSlipRows = [
      makeStandaloneSlip("SLIP/2026/07/W001", { nik: "EMP004", name: "Dedi Hartono", dept: "Produksi", position: "Operator" }, "HARIAN_WEEKLY", "HARIAN_WEEKLY - 03 Jul 2026", "2026-07-03", "2026-07-09", "Selesai", [1200000, 0, 250000, 0, -50000, 0, 1400000])
    ];

    function makeRun(id, batch, structure, start, end, status, count) {
      const slips = Array.from({ length: count }).map((_, index) => {
        const tpl = slipTemplates[index % slipTemplates.length];
        const emp = employees[index] || employees[index % employees.length];
        return makeSlip(tpl.no.replace("/07/", start.slice(5,7) === "06" ? "/06/" : "/07/"), emp, tpl.values, status);
      });
      return {
        id,
        company: companyName,
        batch,
        structure,
        structureName: structures[structure].name,
        periodType: structures[structure].periodType,
        start,
        end,
        employeeCount: count,
        status,
        slips
      };
    }

    function makeStandaloneSlip(no, emp, structure, batch, start, end, status, values) {
      return {
        run: {
          id: "STANDALONE",
          company: companyName,
          batch,
          structure,
          structureName: structures[structure].name,
          periodType: structures[structure].periodType,
          start,
          end,
          status,
          slips: []
        },
        slip: makeSlip(no, emp, values, status)
      };
    }

    function makeSlip(no, emp, values, status) {
      return {
        no,
        nik: emp.nik,
        employee: emp.name,
        dept: emp.dept,
        position: emp.position,
        status,
        values: values.slice(),
        lines: [
          line(10, "GAJI_POKOK", "Gaji Pokok", values[0], false),
          line(20, "TUNJANGAN_TETAP", "Tunjangan Tetap", values[1], true),
          line(30, "LEMBUR", "Lembur", values[2], true),
          line(40, "BONUS", "Bonus", values[3], true),
          line(50, "POT_TERLAMBAT", "Potongan Terlambat", values[4], true),
          line(60, "BPJS_KES_KARYAWAN", "BPJS Kesehatan", values[5], false),
          line(90, "NET", "Take Home Pay", values[6], false)
        ],
        workEntries: baseWorkEntries.slice(0, 4).map(w => ({ code: w[0], name: w[1], qty: w[2], unit: w[3] })),
        inputs: cloneDefaultInputs(["BONUS", "POTONGAN_KOPERASI", "PINJAMAN"])
      };
    }

    function line(order, code, label, amount, adjustable) {
      return { order, code, label, system: amount, adjustment: amount, final: amount, adjustable };
    }

    function cloneDefaultInputs(codes) {
      return codes.map(code => ({ code, name: inputNames[code] || code, amount: defaultInputs[code]?.amount || 0, note: defaultInputs[code]?.note || "" }));
    }

    function fmtMoney(value) {
      return Number(value || 0).toLocaleString("id-ID");
    }

    function fmtPeriod(run) {
      return `${run.start} s/d ${run.end}`;
    }

    function badge(status) {
      const cls = status === "Baru" ? "draft" : status === "Terkonfirmasi" ? "pending" : status === "Selesai" ? "done" : status === "Terbayar" ? "paid" : "cancel";
      return `<span class="badge ${cls}">${status}</span>`;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function showErrors(id, errors) {
      const box = document.getElementById(id);
      if (!errors.length) {
        box.classList.remove("show");
        box.innerHTML = "";
        return;
      }
      box.innerHTML = errors.map(e => `<div>${e}</div>`).join("");
      box.classList.add("show");
    }

    function setView(view, title) {
      const isSlip = view === "slipList" || view === "slipDetail";
      crumbSection.textContent = isSlip ? "Slip Gaji" : "Proses Penggajian";
      crumbTitle.textContent = title;
      listView.classList.toggle("hidden", view !== "list");
      createView.classList.toggle("hidden", view !== "create");
      detailView.classList.toggle("hidden", view !== "detail");
      slipListView.classList.toggle("hidden", view !== "slipList");
      slipDetailView.classList.toggle("hidden", view !== "slipDetail");
      document.querySelector("#processMenuItem")?.classList.toggle("active", !isSlip);
      document.querySelector("#slipMenuItem")?.classList.toggle("active", isSlip);
    }

    function renderList() {
      setView("list", "Daftar Proses Penggajian");
      const status = document.querySelector("#statusFilter")?.value || "";
      const query = (document.querySelector("#searchBox")?.value || "").trim().toLowerCase();
      const rows = payrollRuns.filter(run =>
        (!status || run.status === status) &&
        [run.company, run.batch, run.structureName, run.periodType, run.status].join(" ").toLowerCase().includes(query)
      );
      listView.innerHTML = `
        <div class="toolbar"><button class="btn" type="button" onclick="openCreate()">Tambah</button></div>
        <div class="filter-row">
          <div class="filter-controls">
            <label>
              <span>Status</span>
              <select id="statusFilter" style="width:160px" onchange="renderList()">
                <option value="">Semua</option><option>Baru</option><option>Terkonfirmasi</option><option>Selesai</option><option>Terbayar</option><option>Dibatalkan</option>
              </select>
            </label>
          </div>
        </div>
        <div class="table-tools table-utility-row">
          <span>Menampilkan <select><option>10</option><option>25</option></select> data</span>
          <label class="table-search"><span>Cari</span><input id="searchBox" type="text" style="width:180px" oninput="renderList()"></label>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Perusahaan</th><th>Batch</th><th>Struktur Gaji</th><th style="width:85px">Tipe Periode</th><th>Periode</th><th style="width:85px">Jumlah Karyawan</th><th style="width:120px">Status</th><th style="width:100px">Aksi</th></tr></thead>
            <tbody>${rows.map(run => `<tr><td>${run.company}</td><td>${run.batch}</td><td>${run.structureName}</td><td>${run.periodType}</td><td>${fmtPeriod(run)}</td><td>${run.employeeCount}</td><td>${badge(run.status)}</td><td><div class="actions inline-actions"><button class="btn teal small icon-btn" type="button" title="Lihat" aria-label="Lihat" data-module-action="openRunDetail" data-module-args="${run.id}">${window.iconEye()}</button></div></td></tr>`).join("")}</tbody>
          </table>
        </div>
        <div class="pager"><span>Menampilkan ${rows.length ? "1 - " + rows.length : "0 - 0"} dari ${rows.length} data</span><span class="pages"><button>&lt;</button><button>1</button><button>&gt;</button></span></div>
      `;
      if (document.getElementById("statusFilter")) document.getElementById("statusFilter").value = status;
      if (document.getElementById("searchBox")) document.getElementById("searchBox").value = query;
    }

    function openCreate() {
      selectedEmployees = new Set();
      employeeInputs = {};
      currentBatchDraft = null;
      setView("create", "Tambah Proses Penggajian");
      createView.innerHTML = `
        <div class="toolbar" style="justify-content:flex-start"><button class="btn green" type="button" onclick="processPayroll()">Proses Gaji</button><button class="btn secondary" type="button" onclick="renderList()">Kembali</button></div>
        <div id="createErrors" class="error-box"></div>
        <div class="section"><h2 class="section-title">Header Proses Penggajian</h2>
          <div class="form-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));max-width:760px">
            <div class="form-row"><label>Struktur Gaji</label><select class="form-control" id="structureSelect" onchange="onStructureChange()"><option value="">Pilih Struktur Gaji</option><option value="STAFF_MONTHLY">STAFF_MONTHLY - Staff Bulanan</option><option value="HARIAN_WEEKLY">HARIAN_WEEKLY - Harian Mingguan</option><option value="BORONGAN_WEEKLY">BORONGAN_WEEKLY - Borongan Mingguan</option></select></div>
            <div class="form-row"><label>Tipe Periode</label><input class="form-control" id="periodType" readonly></div>
            <div class="form-row"><label>Periode Mulai</label><input class="form-control" id="periodStart" type="date" onchange="generateBatch()"></div>
            <div class="form-row"><label>Periode Selesai</label><input class="form-control" id="periodEnd" type="date" onchange="generateBatch()"></div>
            <div class="form-row"><label>Batch</label><input class="form-control" id="batchName" type="text"></div>
          </div>
        </div>
        <div class="section"><h2 class="section-title">Filter Karyawan</h2>
          <div class="filters compact">
            <div><label>Tipe Kontrak</label><select class="form-control" id="filterContractType"><option>Semua</option><option>Bulanan</option><option>Harian</option></select></div>
            <div><label>Agama</label><select class="form-control" id="filterReligion"><option>Semua</option><option>Islam</option><option>Kristen</option><option>Katolik</option></select></div>
            <div><label>Departemen</label><div class="lookup-field"><input class="form-control" id="filterDepartment" type="text" value="Semua" readonly><button class="lookup-btn" type="button" onclick="openLookup('department')">&#128269;</button></div></div>
            <div><label>Posisi</label><div class="lookup-field"><input class="form-control" id="filterPosition" type="text" value="Semua" readonly><button class="lookup-btn" type="button" onclick="openLookup('position')">&#128269;</button></div></div>
            <div><label>Karyawan</label><div class="lookup-field"><input class="form-control" id="filterEmployee" type="text" value="Semua" readonly><button class="lookup-btn" type="button" onclick="openLookup('employee')">&#128269;</button></div></div>
          </div>
          <div class="action-row"><button class="btn" type="button" onclick="applyFilter()">Terapkan Filter</button><button class="btn secondary" type="button" onclick="resetFilter()">Reset Filter</button></div>
          <div id="eligibleArea" class="hidden"></div>
        </div>
      `;
    }

    function onStructureChange() {
      const code = document.getElementById("structureSelect").value;
      document.getElementById("periodType").value = code ? structures[code].periodType : "";
      generateBatch();
    }

    function generateBatch() {
      const code = document.getElementById("structureSelect")?.value;
      const start = document.getElementById("periodStart")?.value;
      if (!code || !start) return;
      const month = new Date(start + "T00:00:00").toLocaleString("id-ID", { month: "long", year: "numeric" });
      document.getElementById("batchName").value = `${code} - ${month}`;
    }

    function periodDays(start, end) {
      const a = new Date(start + "T00:00:00");
      const b = new Date(end + "T00:00:00");
      return Math.round((b - a) / 86400000) + 1;
    }

    function validateCreateHeader() {
      const structure = document.getElementById("structureSelect").value;
      const start = document.getElementById("periodStart").value;
      const end = document.getElementById("periodEnd").value;
      const batch = document.getElementById("batchName").value.trim();
      const errors = [];
      if (!structure) errors.push("Struktur Gaji wajib dipilih.");
      if (!start) errors.push("Periode Mulai wajib diisi.");
      if (!end) errors.push("Periode Selesai wajib diisi.");
      if (!batch) errors.push("Batch wajib diisi.");
      if (structure && start && end) {
        const days = periodDays(start, end);
        if (structures[structure].periodType === "Mingguan" && days !== 7) errors.push("Periode Mingguan harus 7 hari.");
        if (structures[structure].periodType === "Bulanan" && (days < 28 || days > 31)) errors.push("Periode Bulanan harus 28 sampai 31 hari.");
      }
      showErrors("createErrors", errors);
      return { valid: !errors.length, structure, start, end, batch };
    }

    function applyFilter() {
      const result = validateCreateHeader();
      if (!result.valid) return;
      currentBatchDraft = result;
      selectedEmployees.clear();
      const contractType = document.getElementById("filterContractType").value;
      const religion = document.getElementById("filterReligion").value;
      const department = document.getElementById("filterDepartment").value;
      const position = document.getElementById("filterPosition").value;
      const employee = document.getElementById("filterEmployee").value;
      const filteredEmployees = employees.filter(emp =>
        (contractType === "Semua" || emp.contractType === contractType) &&
        (religion === "Semua" || emp.religion === religion) &&
        (department === "Semua" || emp.dept === department) &&
        (position === "Semua" || emp.position === position) &&
        (employee === "Semua" || emp.name === employee)
      );
      visibleEligibleNiks = filteredEmployees.map(emp => emp.nik);
      const area = document.getElementById("eligibleArea");
      area.classList.remove("hidden");
      area.innerHTML = `
        <div class="info-bar"><span>Eligible: <b>${filteredEmployees.length}</b></span><span class="info-link" onclick="openIneligible()">Tidak Eligible: ${ineligibleEmployees.length}</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th style="width:44px"><input type="checkbox" onchange="toggleAllEmployees(this.checked)"></th><th style="width:90px">NIK</th><th>Nama Karyawan</th><th>Departemen</th><th>Posisi</th><th style="width:105px">Tipe Kontrak</th><th>Kontrak</th><th style="width:165px">Aksi</th></tr></thead>
            <tbody>${filteredEmployees.length ? filteredEmployees.map(emp => `<tr><td><input type="checkbox" data-nik="${emp.nik}" onchange="toggleEmployee('${emp.nik}', this.checked)"></td><td>${emp.nik}</td><td>${emp.name}</td><td>${emp.dept}</td><td>${emp.position}</td><td>${emp.contractType}</td><td>${emp.contract}</td><td><div class="action-row"><button class="btn teal small" type="button" data-module-action="openWorkEntries" data-module-args="${emp.nik}">Work Entries</button><button class="btn small" type="button" data-module-action="openInputs" data-module-args="${emp.nik}">Input Lain</button></div></td></tr>`).join("") : `<tr><td colspan="8" style="text-align:center;color:#777">Tidak ada karyawan eligible sesuai filter.</td></tr>`}</tbody>
          </table>
        </div>
      `;
    }

    function resetFilter() {
      selectedEmployees.clear();
      filterSelections = { department: "", position: "", employee: "" };
      if (document.getElementById("filterContractType")) document.getElementById("filterContractType").value = "Semua";
      if (document.getElementById("filterReligion")) document.getElementById("filterReligion").value = "Semua";
      ["filterDepartment", "filterPosition", "filterEmployee"].forEach(id => {
        if (document.getElementById(id)) document.getElementById(id).value = "Semua";
      });
      document.getElementById("eligibleArea").classList.add("hidden");
      document.getElementById("eligibleArea").innerHTML = "";
      showErrors("createErrors", []);
    }

    function toggleEmployee(nik, checked) {
      if (checked) selectedEmployees.add(nik); else selectedEmployees.delete(nik);
    }

    function toggleAllEmployees(checked) {
      visibleEligibleNiks.forEach(nik => checked ? selectedEmployees.add(nik) : selectedEmployees.delete(nik));
      document.querySelectorAll("[data-nik]").forEach(box => box.checked = checked);
    }

    function employeeByNik(nik) {
      return employees.find(emp => emp.nik === nik) || employees[0];
    }

    function openWorkEntries(nik, slipNo = null) {
      const emp = employeeByNik(nik);
      const period = currentBatchDraft ? `${currentBatchDraft.start} s/d ${currentBatchDraft.end}` : fmtPeriod(payrollRuns.find(r => r.id === currentRunId));
      document.getElementById("workEntriesTitle").textContent = `Work Entries - ${emp.name}`;
      document.getElementById("workEntriesSummary").innerHTML = `<div><span>NIK</span><b>${emp.nik}</b></div><div><span>Nama Karyawan</span><b>${emp.name}</b></div><div><span>Periode</span><b>${period}</b></div>`;
      const data = slipNo ? currentRun().slips.find(s => s.no === slipNo).workEntries.map(w => [w.code, w.name, w.qty, w.unit]) : baseWorkEntries;
      document.getElementById("workEntriesRows").innerHTML = data.map(row => `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td></tr>`).join("");
      showModal("workEntriesModal");
    }

    function getEmployeeInputs(nik) {
      const structure = currentBatchDraft?.structure || "STAFF_MONTHLY";
      if (!employeeInputs[nik]) employeeInputs[nik] = cloneDefaultInputs(structures[structure].inputs);
      return employeeInputs[nik];
    }

    function openInputs(nik) {
      currentInputNik = nik;
      const emp = employeeByNik(nik);
      const period = currentBatchDraft ? `${currentBatchDraft.start} s/d ${currentBatchDraft.end}` : fmtPeriod(currentRun());
      document.getElementById("inputTitle").textContent = `Input Lain - ${emp.name}`;
      document.getElementById("inputSummary").innerHTML = `<div><span>NIK</span><b>${emp.nik}</b></div><div><span>Nama Karyawan</span><b>${emp.name}</b></div><div><span>Struktur Gaji</span><b>${structures[currentBatchDraft?.structure || "STAFF_MONTHLY"].name}</b></div><div><span>Periode</span><b>${period}</b></div>`;
      document.getElementById("inputRows").innerHTML = getEmployeeInputs(nik).map((item, index) => `<tr><td>${item.code}</td><td>${item.name}</td><td><input class="form-control" type="number" value="${item.amount}" data-input-amount="${index}"></td><td><input class="form-control" type="text" value="${item.note}" data-input-note="${index}"></td></tr>`).join("");
      showModal("inputModal");
    }

    function saveInputs() {
      if (!currentInputNik) return;
      const items = getEmployeeInputs(currentInputNik);
      items.forEach((item, index) => {
        item.amount = Number(document.querySelector(`[data-input-amount="${index}"]`).value || 0);
        item.note = document.querySelector(`[data-input-note="${index}"]`).value;
      });
      showToast("Input lain berhasil disimpan.");
    }

    function openIneligible() {
      document.getElementById("ineligibleRows").innerHTML = ineligibleEmployees.map(emp => `<tr><td>${emp.nik}</td><td>${emp.name}</td><td>${emp.dept}</td><td>${emp.position}</td><td>${emp.reason}</td></tr>`).join("");
      showModal("ineligibleModal");
    }

    function lookupLabel(type) {
      if (type === "department") return "Departemen";
      if (type === "position") return "Posisi";
      return "Karyawan";
    }

    function lookupInputId(type) {
      if (type === "department") return "filterDepartment";
      if (type === "position") return "filterPosition";
      return "filterEmployee";
    }

    function openLookup(type) {
      activeLookupType = type;
      document.getElementById("lookupTitle").textContent = `Pilih ${lookupLabel(type)}`;
      document.getElementById("lookupSearch").value = "";
      renderLookupRows();
      showModal("lookupModal");
    }

    function renderLookupRows() {
      if (!activeLookupType) return;
      const query = document.getElementById("lookupSearch").value.trim().toLowerCase();
      const rows = lookupData[activeLookupType].filter(item =>
        item.code.toLowerCase().includes(query) || item.name.toLowerCase().includes(query)
      );
      document.getElementById("lookupRows").innerHTML = rows.map(item => `
        <tr>
          <td>${item.code}</td>
          <td>${item.name}</td>
          <td><button class="btn small" type="button" data-module-action="selectLookup" data-module-args="${encodeURIComponent(item.code)}|${encodeURIComponent(item.name)}">Pilih</button></td>
        </tr>
      `).join("");
    }

    function selectLookup(code, name) {
      if (!activeLookupType) return;
      filterSelections[activeLookupType] = code;
      document.getElementById(lookupInputId(activeLookupType)).value = name;
      closeModal("lookupModal");
    }

    function clearLookup() {
      if (!activeLookupType) return;
      filterSelections[activeLookupType] = "";
      document.getElementById(lookupInputId(activeLookupType)).value = "Semua";
      closeModal("lookupModal");
    }

    function processPayroll() {
      const result = validateCreateHeader();
      if (!result.valid) return;
      if (!selectedEmployees.size) {
        showErrors("createErrors", ["Pilih minimal satu karyawan untuk diproses."]);
        return;
      }
      currentBatchDraft = result;
      startProgress([...selectedEmployees]);
    }

    function startProgress(niks) {
      document.getElementById("progressTotal").textContent = niks.length;
      document.getElementById("progressDone").textContent = "0";
      document.getElementById("progressSuccess").textContent = "0";
      document.getElementById("progressFailed").textContent = "0";
      document.getElementById("progressBar").style.width = "0%";
      showModal("progressModal");
      let done = 0;
      const timer = setInterval(() => {
        done += 1;
        document.getElementById("progressDone").textContent = done;
        document.getElementById("progressSuccess").textContent = done;
        document.getElementById("progressBar").style.width = `${Math.round(done / niks.length * 100)}%`;
        if (done >= niks.length) {
          clearInterval(timer);
          createProcessedRun(niks);
          setTimeout(() => {
            closeModal("progressModal");
            renderRunDetail();
            showToast("Proses penggajian berhasil dibuat.");
          }, 500);
        }
      }, 450);
    }

    function createProcessedRun(niks) {
      const id = `RUN${String(payrollRuns.length + 1).padStart(3, "0")}`;
      const slips = niks.map((nik, index) => {
        const emp = employeeByNik(nik);
        const tpl = slipTemplates[index % slipTemplates.length];
        return makeSlip(`SLIP/2026/07/${String(index + 1).padStart(4, "0")}`, emp, tpl.values, "Terkonfirmasi");
      });
      const run = {
        id,
        company: companyName,
        batch: currentBatchDraft.batch,
        structure: currentBatchDraft.structure,
        structureName: structures[currentBatchDraft.structure].name,
        periodType: structures[currentBatchDraft.structure].periodType,
        start: currentBatchDraft.start,
        end: currentBatchDraft.end,
        employeeCount: slips.length,
        status: "Terkonfirmasi",
        slips
      };
      payrollRuns.unshift(run);
      currentRunId = id;
    }

    function openRunDetail(id) {
      currentRunId = id;
      renderRunDetail();
    }

    function currentRun() {
      return payrollRuns.find(run => run.id === currentRunId) || payrollRuns[0];
    }

    function getVisibleSlips(run) {
      const query = detailSearch.trim().toLowerCase();

      let rows = run.slips.filter(slip =>
        slip.no.toLowerCase().includes(query) ||
        slip.nik.toLowerCase().includes(query) ||
        slip.employee.toLowerCase().includes(query) ||
        slip.dept.toLowerCase().includes(query) ||
        slip.position.toLowerCase().includes(query)
      );

      if (detailPageSize !== "All") {
        rows = rows.slice(0, Number(detailPageSize));
      }

      return rows;
    }

    function setDetailPageSize(value) {
      detailPageSize = value;
      renderRunDetail();
    }

    function setDetailSearch(value) {
      detailSearch = value;
      renderRunDetail();
    }

    function getSlipRecords() {
      const runRecords = payrollRuns.flatMap(run => run.slips.map(slip => ({ run, slip })));
      return [...runRecords, ...standaloneSlipRows];
    }

    function findSlipRecord(no) {
      if (String(no).includes("|")) {
        const [runId, slipNo] = String(no).split("|");
        return getSlipRecords().find(record => record.run.id === runId && record.slip.no === slipNo);
      }
      return getSlipRecords().find(record => record.slip.no === no);
    }

    function getFilteredSlipRecords() {
      const query = slipListSearch.trim().toLowerCase();
      let rows = getSlipRecords().filter(({ run, slip }) =>
        (!slipListFilters.status || slip.status === slipListFilters.status) &&
        (!slipListFilters.structure || run.structure === slipListFilters.structure) &&
        (!slipListFilters.department || slip.dept === slipListFilters.department) &&
        (!slipListFilters.position || slip.position === slipListFilters.position) &&
        [slip.no, slip.nik, slip.employee, slip.dept, slip.position, run.batch, run.structureName, slip.status].join(" ").toLowerCase().includes(query)
      );
      if (slipListPageSize !== "All") rows = rows.slice(0, Number(slipListPageSize));
      return rows;
    }

      slipListFilters[key] = value;

      renderSlipList();

    function openSlipDetailPage(key) {

    function renderSlipDetailPage(tab = "component") {

      }
      if (tab === "input") {
        return `<div class="table-wrap"><table><thead><tr><th style="width:180px">Kode Input</th><th>Nama Input</th><th style="width:180px">Nominal</th><th>Keterangan</th></tr></thead><tbody>${slip.inputs.map((item, index) => `<tr><td>${item.code}</td><td>${item.name}</td><td><input class="form-control" type="number" value="${item.amount}" data-page-input-amount="${index}" ${locked ? "readonly" : ""}></td><td><input class="form-control" type="text" value="${item.note}" data-page-input-note="${index}" ${locked ? "readonly" : ""}></td></tr>`).join("")}</tbody></table></div>`;
      }
      return `<div class="table-wrap"><table><thead><tr><th>Nama Tampilan</th><th style="width:140px">Hasil Sistem</th><th style="width:160px">Adjustment</th><th style="width:140px">Nominal Final</th></tr></thead><tbody>${slip.lines.map((line, index) => line.code === "NET" ? `<tr><td>${line.label}</td><td style="text-align:center;color:#999">-</td><td style="text-align:center;color:#999">-</td><td style="text-align:right">${fmtMoney(line.final)}</td></tr>` : `<tr><td>${line.label}</td><td style="text-align:right">${fmtMoney(line.system)}</td><td><input class="form-control" type="number" value="${line.adjustment}" data-page-adjust="${index}" oninput="updateSlipPageAdjustment(${index}, this.value)" ${locked || !line.adjustable ? "readonly" : ""}></td><td style="text-align:right" id="pageLineFinal${index}">${fmtMoney(line.final)}</td></tr>`).join("")}</tbody></table></div>`;
    }

    function updateSlipPageAdjustment(index, value) {
      const record = findSlipRecord(currentSlipPageKey || currentSlipPageNo);
      if (!record) return;
      const line = record.slip.lines[index];
      if (!line || !line.adjustable) return;
      line.adjustment = Number(value || 0);
      line.final = line.adjustment;
      record.slip.values[index] = line.final;
      const finalCell = document.getElementById(`pageLineFinal${index}`);
      if (finalCell) finalCell.textContent = fmtMoney(line.final);
    }

    function saveSlipPageAdjustment() {
      const record = findSlipRecord(currentSlipPageKey || currentSlipPageNo);
      if (!record) return;
      record.slip.lines.forEach((line, index) => {
        const input = document.querySelector(`[data-page-adjust="${index}"]`);
        if (input && line.adjustable) {
          line.adjustment = Number(input.value || 0);
          line.final = line.adjustment;
          record.slip.values[index] = line.final;
        }
      });
      showToast("Adjustment berhasil disimpan.");
      renderSlipDetailPage("component");
    }

    function saveSlipPageInput() {
      const record = findSlipRecord(currentSlipPageKey || currentSlipPageNo);
      if (!record || ["Selesai", "Terbayar"].includes(record.slip.status)) return;
      record.slip.inputs.forEach((item, index) => {
        const amount = document.querySelector(`[data-page-input-amount="${index}"]`);
        const note = document.querySelector(`[data-page-input-note="${index}"]`);
        if (amount) item.amount = Number(amount.value || 0);
        if (note) item.note = note.value;
      });
      showToast("Input lain berhasil disimpan.");
    }

    function recomputeSlipPage() {
      const record = findSlipRecord(currentSlipPageKey || currentSlipPageNo);
      if (!record) return;
      const slip = record.slip;
      const locked = ["Selesai", "Terbayar"].includes(slip.status);
      slip.lines.forEach((line, index) => {
        const input = document.querySelector(`[data-page-adjust="${index}"]`);
        if (input && line.adjustable && !locked) {
          line.adjustment = Number(input.value || 0);
          line.final = line.adjustment;
          slip.values[index] = line.final;
        }
      });
      if (!locked) {
        slip.inputs.forEach((item, index) => {
          const amount = document.querySelector(`[data-page-input-amount="${index}"]`);
          const note = document.querySelector(`[data-page-input-note="${index}"]`);
          if (amount) item.amount = Number(amount.value || 0);
          if (note) item.note = note.value;
        });
      }
      const inputTotal = code => slip.inputs
        .filter(item => item.code === code)
        .reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const bonusLine = slip.lines.find(line => line.code === "BONUS");
      if (bonusLine) {
        bonusLine.system = inputTotal("BONUS");
        bonusLine.adjustment = bonusLine.system;
        bonusLine.final = bonusLine.system;
        slip.values[3] = bonusLine.final;
      }
      const potonganInput = inputTotal("POTONGAN_KOPERASI") + inputTotal("PINJAMAN") + inputTotal("KOREKSI_POTONGAN");
      const potonganLine = slip.lines.find(line => line.code === "POT_TERLAMBAT");
      if (potonganLine && potonganInput) {
        potonganLine.system = -potonganInput;
        potonganLine.adjustment = potonganLine.system;
        potonganLine.final = potonganLine.system;
        slip.values[4] = potonganLine.final;
      }
      const totalNonNet = slip.values.slice(0, -1).reduce((sum, value) => sum + Number(value || 0), 0);
      slip.values[slip.values.length - 1] = totalNonNet;
      const netLine = slip.lines[slip.lines.length - 1];
      netLine.system = totalNonNet;
      netLine.adjustment = totalNonNet;
      netLine.final = totalNonNet;
      showToast("Slip gaji berhasil dihitung ulang.");
      renderSlipDetailPage("component");
    }

    function recomputeSlip(no) {
      const run = currentRun();
      const slip = run.slips.find(item => item.no === no);
      if (!slip) return;

      currentSlipNo = no;

      slip.lines.forEach((line, index) => {
        const input = document.querySelector(`[data-adjust="${index}"]`);
        if (input && line.adjustable) {
          line.adjustment = Number(input.value || 0);
          line.final = line.adjustment;
          slip.values[index] = line.final;
        }
      });

      if (!["Selesai", "Terbayar"].includes(run.status)) {
        slip.inputs.forEach((item, index) => {
          const amountInput = document.querySelector(`[data-slip-input-amount="${index}"]`);
          const noteInput = document.querySelector(`[data-slip-input-note="${index}"]`);
          if (amountInput) item.amount = Number(amountInput.value || 0);
          if (noteInput) item.note = noteInput.value;
        });
      }

      const inputTotal = code => slip.inputs
        .filter(item => item.code === code)
        .reduce((sum, item) => sum + Number(item.amount || 0), 0);

      const bonusLine = slip.lines.find(line => line.code === "BONUS");
      if (bonusLine) {
        bonusLine.system = inputTotal("BONUS");
        bonusLine.adjustment = bonusLine.system;
        bonusLine.final = bonusLine.system;
        slip.values[3] = bonusLine.final;
      }

      const potonganInput = inputTotal("POTONGAN_KOPERASI") + inputTotal("PINJAMAN") + inputTotal("KOREKSI_POTONGAN");
      const potonganLine = slip.lines.find(line => line.code === "POT_TERLAMBAT");
      if (potonganLine && potonganInput) {
        potonganLine.system = -potonganInput;
        potonganLine.adjustment = potonganLine.system;
        potonganLine.final = potonganLine.system;
        slip.values[4] = potonganLine.final;
      }

      const totalNonNet = slip.values.slice(0, -1).reduce((sum, value) => sum + Number(value || 0), 0);
      slip.values[slip.values.length - 1] = totalNonNet;

      const netLine = slip.lines[slip.lines.length - 1];
      netLine.system = totalNonNet;
      netLine.adjustment = totalNonNet;
      netLine.final = totalNonNet;

      showToast("Perubahan slip gaji berhasil disimpan dan dihitung ulang.");
      renderRunDetail();
      openSlip(no);
    }

    function renderSlipTabs(tab) {
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.tab === tab));

      document.getElementById("slipWorkTab").classList.toggle("hidden", tab !== "work");
      document.getElementById("slipInputTab").classList.toggle("hidden", tab !== "input");
      const slip = currentRun().slips.find(item => item.no === currentSlipNo);
      const locked = ["Selesai", "Terbayar"].includes(currentRun().status);
      if (tab === "component") {
        document.getElementById("slipComponentTab").innerHTML = `<div class="table-wrap"><table><thead><tr><th>Nama Tampilan</th><th style="width:140px">Hasil Sistem</th><th style="width:160px">Adjustment</th><th style="width:140px">Nominal Final</th></tr></thead><tbody>${slip.lines.map((line, index) => line.code === "NET" ? `<tr><td>${line.label}</td><td style="text-align:center;color:#999">-</td><td style="text-align:center;color:#999">-</td><td style="text-align:right" id="lineFinal${index}">${fmtMoney(line.final)}</td></tr>` : `<tr><td>${line.label}</td><td style="text-align:right">${fmtMoney(line.system)}</td><td><input class="form-control" type="number" value="${line.adjustment}" data-adjust="${index}" ${!line.adjustable ? "readonly" : ""}></td><td style="text-align:right" id="lineFinal${index}">${fmtMoney(line.final)}</td></tr>`).join("")}</tbody></table></div>`;

          slip.lines[idx].final = slip.lines[idx].adjustment;
          document.getElementById(`lineFinal${idx}`).textContent = fmtMoney(slip.lines[idx].final);

      if (tab === "work") {
        document.getElementById("slipWorkTab").innerHTML = `<div class="table-wrap"><table><thead><tr><th>Kode</th><th>Nama</th><th style="width:130px">Jumlah</th><th style="width:130px">Satuan</th></tr></thead><tbody>${slip.workEntries.map(item => `<tr><td>${item.code}</td><td>${item.name}</td><td>${item.qty}</td><td>${item.unit}</td></tr>`).join("")}</tbody></table></div>`;

          if (prop === 'classList') return { add: noop, remove: noop, toggle: noop, contains: () => false };
          if (prop === 'style') return {};
          if (prop === 'dataset') return {};
          if (prop === 'value') return '';
          if (prop === 'textContent') return '';
          if (prop === 'innerHTML') return '';
          if (prop === 'checked') return false;
          if (prop === 'parentNode') return null;
          if (prop === 'children') return [];
          return undefined;
        }
      });
    }

    function warnMissingElement(key, type = 'id') {
      const warningKey = `${type}:${key}`;
      if (missingElementWarnings.has(warningKey)) return;
      const label = type === 'selector' ? 'selector' : 'id';
      console.warn(`Element dengan ${label} "${key}" tidak ditemukan di module aktif.`);
      missingElementWarnings.add(warningKey);
    }

    function getShellElement(id) {
      return document.getElementById(id);
    }

    function createScopedDocument() {
      const queryInModule = selector => {
        try {
          return moduleRoot.querySelector(selector);
        } catch (error) {
          console.warn(`Selector module tidak valid: "${selector}"`, error);
          return null;
        }
      };
      const queryAllInModule = selector => {
        try {
          return moduleRoot.querySelectorAll(selector);
        } catch (error) {
          console.warn(`Selector module tidak valid: "${selector}"`, error);
          return [];
        }
      };
      const resolveElement = id => {
        const scopedElement = getModuleElementById(id);
        if (scopedElement) return scopedElement;
        warnMissingElement(id, 'id');
        return createSafeElementStub();
      };
      return {
        getElementById: id => resolveElement(id),
        querySelector: selector => queryInModule(selector),
        querySelectorAll: selector => queryAllInModule(selector),
        createElement: tagName => document.createElement(tagName),
        createTextNode: text => document.createTextNode(text),
        addEventListener: (...args) => moduleRoot.addEventListener(...args),
        removeEventListener: (...args) => moduleRoot.removeEventListener(...args),
        getShellElement,
        body: moduleRoot,
        documentElement: moduleHost
      };
    }

    /*
      Legacy compatibility only.
      Screen baru harus render badge/status secara eksplisit dari render function.
      Jangan mengandalkan auto-normalize ini untuk screen baru.
    */
    function normalizeStatusBadges() {
      moduleRoot.querySelectorAll('table td').forEach(td => {
        if (td.querySelector('.status-badge-normalized,.badge')) return;
        const found = statusMap[td.textContent.trim().toLowerCase()];
        if (!found) return;
        td.innerHTML = `<span class="status-badge-normalized ${found[1]}">${found[0]}</span>`;
      });
    }

    function inlineDatasetKey(type) {
      return 'inline' + type[0].toUpperCase() + type.slice(1);
    }

    function inlineSelector(type) {
      return '[data-inline-' + type + ']';
    }

    function captureInlineHandlers() {
      moduleRoot.querySelectorAll('[onclick],[onchange],[oninput]').forEach(element => {
        ['click', 'change', 'input'].forEach(type => {
          const attrName = 'on' + type;
          if (!element.hasAttribute(attrName)) return;
          element.dataset[inlineDatasetKey(type)] = element.getAttribute(attrName);
          element.removeAttribute(attrName);
        });
      });
    }

    function runInlineHandler(expression, event) {
      if (!expression) return;
      const scope = {};
      Object.keys(activeModuleApi || {}).forEach(key => {
        scope[key] = activeModuleApi[key];
      });
      scope.event = event;
      scope.document = createScopedDocument();
      scope.window = window;
      try {
        const runner = new Function('scope', 'event', `with (scope) { ${expression}; }`);
        runner.call(event.target, scope, event);
        afterModuleRender();
      } catch (error) {
        console.warn("Inline handler failed:", expression, error);
      }
    }

    function parseModuleArgs(value) {
      if (value == null) return [];
      const raw = String(value).trim();
      if (!raw) return [];
      if (raw.startsWith('[') && raw.endsWith(']')) {
        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed;
        } catch (error) {
          // Fallback ke format lama.
        }
      }
      return raw.split('|').map(item => {
        const trimmed = item.trim();
        if (/^-?\d+(\.\d+)?$/.test(trimmed)) return Number(trimmed);
        if (trimmed === 'true') return true;
        if (trimmed === 'false') return false;
        if (trimmed === 'null') return null;
        try {
          return decodeURIComponent(trimmed);
        } catch (error) {
          return trimmed;
        }
      });
    }

    function runModuleAction(target) {
      const actionName = target.dataset.moduleAction;
      const fn = activeModuleApi[actionName];
      if (typeof fn !== 'function') {
        console.warn(`Module action "${actionName}" tidak ditemukan di module aktif.`);
        return;
      }
      try {
        const args = parseModuleArgs(target.dataset.moduleArgs);
        fn(...args);
        afterModuleRender();
      } catch (error) {
        console.warn("Module action failed:", actionName, parseModuleArgs(target.dataset.moduleArgs), error);
      }
    }

    function bindModuleActionButtons() {
      moduleRoot.querySelectorAll('[data-module-action]').forEach(button => {
        if (button.dataset.moduleActionBound === '1') return;
        button.dataset.moduleActionBound = '1';
        button.addEventListener('click', event => {
          event.preventDefault();
          event.stopPropagation();
          runModuleAction(button);
        });
      });
    }

    function findEventTarget(event, selector) {
      if (event.target && event.target.closest) {
        const closest = event.target.closest(selector);
        if (closest) return closest;
      }
      return event.composedPath ? event.composedPath().find(item => item?.matches?.(selector)) : null;
    }

    function bindInlineHandlerBridge() {
      if (inlineBridgeBound) return;
      inlineBridgeBound = true;
      ['click', 'change', 'input'].forEach(type => {
        moduleRoot.addEventListener(type, event => {
          if (type === 'click') {
            const actionTarget = findEventTarget(event, '[data-module-action]');
            if (actionTarget) {
              event.preventDefault();
              runModuleAction(actionTarget);
              return;
            }
          }
          const attrName = 'on' + type;
          const target = findEventTarget(event, `${inlineSelector(type)},[${attrName}]`);
          if (!target) return;
          const expression = target.dataset[inlineDatasetKey(type)] || target.getAttribute(attrName);
          if (target.hasAttribute(attrName)) {
            target.dataset[inlineDatasetKey(type)] = expression;
            target.removeAttribute(attrName);
          }
          event.preventDefault();
          runInlineHandler(expression, event);
        });
      });
    }

    function syncCrumbsFromModule() {
      const route = routes[currentRouteKey];
      if (!route) return;
      const title = getModuleElementById('crumbTitle');
      const titleHidden = title && (title.classList.contains('hidden') || getComputedStyle(title).display === 'none');
      const moduleTitle = title && !titleHidden ? title.textContent.trim() : '';
      const nextTitle = moduleTitle && moduleTitle !== route.menu ? moduleTitle : route.title;
      setCrumbs(route, route.menu, nextTitle);
    }

    function afterModuleRender() {
      captureInlineHandlers();
      bindModuleActionButtons();
      normalizeStatusBadges();
      syncCrumbsFromModule();
    }

    function scheduleAfterModuleRender() {
      if (afterRenderQueued) return;
      afterRenderQueued = true;
      requestAnimationFrame(() => {
        afterRenderQueued = false;
        afterModuleRender();
      });
    }

    function exposeModuleApi(script) {
      const scopedDocument = createScopedDocument();
      const functionNames = Array.from(new Set([
        ...Array.from(script.matchAll(/function\s+([A-Za-z_$][\w$]*)\s*\(/g)).map(match => match[1]),
        ...Array.from(script.matchAll(/(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s+)?(?:function\b|\([^)]*\)\s*=>|[A-Za-z_$][\w$]*\s*=>)/g)).map(match => match[1])
      ]));
      const exportExpression = functionNames.map(name => `${JSON.stringify(name)}: typeof ${name} === 'function' ? ${name} : undefined`).join(',');
      const runner = new Function('document', 'window', `
        return (function(){
          ${script}
          return { ${exportExpression} };
        }).call(window);
      `);
      const scopedWindow = new Proxy(window, {
        get(target, prop) {
          if (prop === 'document') return scopedDocument;
          if (['scrollTo', 'scroll', 'scrollBy'].includes(prop)) return target[prop].bind(target);
          return target[prop];
        },
        set(target, prop, value) {
          target[prop] = value;
          return true;
        }
      });
      const nextModuleApi = runner(scopedDocument, scopedWindow) || {};
      activeModuleApi = Object.fromEntries(
        Object.entries(nextModuleApi).filter(([, value]) => typeof value === 'function')
      );
    }

    function mountModule(moduleKey) {
      const module = parseModule(moduleKey);
      if (moduleObserver) moduleObserver.disconnect();
      moduleRoot.innerHTML = `<style>${module.styles}\n${SHARED_MODULE_STYLE}</style>${module.body}`;
      exposeModuleApi(module.script);
      moduleObserver = new MutationObserver(scheduleAfterModuleRender);
      moduleObserver.observe(moduleRoot, { childList: true, subtree: true, characterData: true, attributes: true });
      afterModuleRender();
    }

    function callRoute(route) {
      const routeFn = activeModuleApi[route.fn];
      if (typeof routeFn !== 'function') {
        console.warn(`Route function "${route.fn}" tidak ditemukan di module aktif.`);
        return;
      }
      try {
        routeFn();
        afterModuleRender();
      } catch (error) {
        console.warn('Route function failed:', route.fn, error);
      }
    }

    function openRoute(routeKey) {
      const route = routes[routeKey];
      if (!route) {
        console.warn(`Route "${routeKey}" belum terdaftar di APP_ROUTES.`);
        return;
      }
      currentRouteKey = routeKey;
      setActiveRoute(routeKey);
      setCrumbs(route);
      if (currentModule !== route.module) {
        currentModule = route.module;
        mountModule(route.module);
      }
      callRoute(route);
    }
    document.getElementById('sidebarBtn').addEventListener('click', () => {
      document.getElementById('appShell').classList.toggle('sidebar-collapsed');
    });
    renderSidebarMenu();
    document.getElementById('sidebarMenu').addEventListener('click', event => {
      const target = event.target.closest ? event.target : event.target.parentElement;
      const toggleButton = target.closest('[data-toggle-group]');
      if (toggleButton) {
        toggleButton.closest('.nav-group').classList.toggle('open');
        return;
      }
      const routeButton = target.closest('[data-route]');
      if (routeButton) openRoute(routeButton.dataset.route);
    });

    openRoute('general.company');
  </script>
</body>
</html>
