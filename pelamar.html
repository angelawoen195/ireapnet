<body>

  <div class="modal-backdrop" id="modalBackdrop"></div>

  <script>

    function renderApplications() {
      $("app").innerHTML = `
        <div class="filters" style="grid-template-columns:2fr 1fr"><input class="form-control" id="qApp" placeholder="Cari nomor lamaran atau posisi" oninput="renderApplicationRows()"><select class="form-control" id="fStatus" onchange="renderApplicationRows()"><option value="">Semua Status</option>${Object.entries(labels).map(([k,v]) => `<option value="${k}">${v}</option>`).join("")}</select></div><div id="applicationRows"></div>`;
      renderApplicationRows();
    }
    function renderApplicationRows() {
      const q = ($("qApp")?.value || "").toLowerCase(), fs = $("fStatus")?.value;
      const list = applications.filter(a => Number(a.candidate_id) === CURRENT_CANDIDATE_ID).filter(a => {
        const v = applicationVacancy(a);
        return (!fs || a.status === fs) && (!q || String(a.application_number).toLowerCase().includes(q) || String(v.position || "").toLowerCase().includes(q));
      });
      $("applicationRows").innerHTML = list.length ? `<div class="table-wrap desktop-table"><table><thead><tr><th>Nomor</th><th>Tanggal</th><th>Posisi</th><th>Departemen</th><th>Company</th><th>Tahap</th><th>Status</th><th class="action-col">Aksi</th></tr></thead><tbody>${list.map(applicationRow).join("")}</tbody></table></div><div class="mobile-cards">${list.map(a => { const v = applicationVacancy(a); return mobileItem(`${a.application_number} - ${v.position || "-"}`, `${labels[a.status]} | ${fmtDate(a.applied_at)}`, actionButton(`go('applicationDetail',${a.id})`, "Lihat", `Lihat lamaran ${a.application_number}`, iconEye(), "teal")); }).join("")}</div>` : `<div class="empty">Belum ada lamaran sesuai filter.</div>`;
    }
    function applicationRow(a) { const v = applicationVacancy(a); return `<tr><td>${a.application_number}</td><td>${fmtDate(a.applied_at)}</td><td>${esc(v.position)}</td><td>${esc(v.dept)}</td><td>${esc(v.company)}</td><td>${esc(applicationStageName(a))}</td><td>${badge(a.status)}</td><td class="action-cell"><div class="actions inline-actions">${actionButton(`go('applicationDetail',${a.id})`, "Lihat", `Lihat lamaran ${a.application_number}`, iconEye(), "teal")}</div></td></tr>`; }
    function renderApplicationDetail(id) {
      const a = applications.find(x => Number(x.id) === Number(id) && Number(x.candidate_id) === CURRENT_CANDIDATE_ID);
      if (!a) { go("applications"); return; }
      const v = applicationVacancy(a);
      const files = applicationAttachments(a.id);
      const showReason = a.status_reason && ["REJECTED", "WITHDRAWN", "CANCELLED"].includes(a.status);
      $("app").innerHTML = `
        <div class="toolbar" style="justify-content:flex-start">
          <button class="btn secondary" onclick="go('applications')">Kembali</button>
          ${a.status === "PROCESSING" ? `<button class="btn red" onclick="openWithdraw(${a.id})">Mengundurkan Diri</button>` : ""}
        </div>
        <div class="form-section">
          <h3 class="form-section-title">Informasi Lamaran</h3>
          <div class="grid cols-2">
            <div><label>Nomor Lamaran</label><input class="form-control" value="${esc(a.application_number)}" readonly></div>
            <div><label>Tanggal Melamar</label><input class="form-control" value="${fmtDateTimeShort(a.applied_at)}" readonly></div>
            <div><label>Tahap Saat Ini</label><input class="form-control" value="${esc(applicationStageName(a))}" readonly></div>
            <div><label>Status</label><input class="form-control" value="${labels[a.status] || a.status}" readonly></div>
            <div><label>Tanggal Status Berubah</label><input class="form-control" value="${fmtDateTimeShort(a.status_changed_at)}" readonly></div>
          </div>
          ${showReason ? `<div style="margin-top:12px"><label>Alasan Status</label><textarea class="form-control" readonly>${esc(a.status_reason)}</textarea></div>` : ""}
        </div>
        <div class="form-section">
          <h3 class="form-section-title">Informasi Lowongan</h3>
          <div class="grid cols-2">
            <div><label>Company</label><input class="form-control" value="${esc(v.company)}" readonly></div>
            <div><label>Departemen</label><input class="form-control" value="${esc(v.dept)}" readonly></div>
            <div><label>Posisi</label><input class="form-control" value="${esc(v.position)}" readonly></div>
            <div><label>Tipe Karyawan</label><input class="form-control" value="${esc(v.type)}" readonly></div>
          </div>
        </div>
        <div class="form-section">
          <h3 class="form-section-title">Data Lamaran</h3>
          <div class="grid cols-2">
            <div><label>Tanggal Bersedia Mulai Bekerja</label><input class="form-control" value="${fmtDate(a.available_start_date)}" readonly></div>
            <div><label>Ekspektasi Gaji</label><input class="form-control" value="${money(a.expected_salary)}" readonly></div>
          </div>
          <div style="margin-top:12px"><label>Catatan Pelamar</label><textarea class="form-control" readonly>${esc(a.candidate_note || "-")}</textarea></div>
        </div>
        <div class="form-section">
          <h3 class="form-section-title">Lampiran</h3>
          <div class="files">${files.length ? files.map(f => `<div class="file-row"><span>${esc(f.file_name)}</span>${actionButton(`downloadAttachment('${escJs(f.file_name)}')`, "Unduh", `Unduh ${f.file_name}`, iconDownload(), "download-btn")}</div>`).join("") : "-"}</div>
        </div>`;
    }

    function escJs(v) {
      return String(v ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    }
    function downloadAttachment(fileName) {
      showToast(`Lampiran ${fileName} diunduh.`);
    }

    function openEducation(id) {
      const item = candidate.educations.find(e => e.id === id) || { id:null, level:"", institution:"", major:"", startYear:"", endYear:"", current:false };
      openModal(`${item.id ? "Ubah" : "Tambah"} Pendidikan`, educationForm(item), `<button class="btn green" onclick="saveEducation(${item.id || 0})">Simpan</button><button class="btn secondary" onclick="closeModal()">Batal</button>`);
      toggleEduEnd();
    }
    function educationForm(e) { return `<div class="grid cols-2"><div><label>Tingkat Pendidikan</label><input class="form-control" id="eduLevel" value="${esc(e.level)}"></div><div><label>Nama Institusi</label><input class="form-control" id="eduInst" value="${esc(e.institution)}"></div><div><label>Jurusan</label><input class="form-control" id="eduMajor" value="${esc(e.major)}"></div><div><label>Tahun Mulai</label><input class="form-control" type="number" id="eduStart" value="${esc(e.startYear)}"></div><div><label>Tahun Selesai</label><input class="form-control" type="number" id="eduEnd" value="${esc(e.endYear)}"></div><label class="checkline"><input type="checkbox" id="eduCurrent" ${e.current ? "checked" : ""} onchange="toggleEduEnd()"> Masih Menempuh Pendidikan</label></div>`; }
    function toggleEduEnd() { if ($("eduEnd")) { $("eduEnd").disabled = $("eduCurrent").checked; if ($("eduCurrent").checked) $("eduEnd").value = ""; } }
    function saveEducation(id) {
      const item = { id:id || Date.now(), level:$("eduLevel").value, institution:$("eduInst").value, major:$("eduMajor").value, startYear:Number($("eduStart").value), endYear:$("eduEnd").value ? Number($("eduEnd").value) : "", current:$("eduCurrent").checked };
      if (!item.level || !item.institution || !item.startYear) return showToast("Tingkat, institusi, dan tahun mulai wajib diisi.", true);
      if (!item.current && item.endYear && item.endYear < item.startYear) return showToast("Tahun selesai tidak boleh lebih kecil dari tahun mulai.", true);
      const idx = candidate.educations.findIndex(e => e.id === id);
      idx >= 0 ? candidate.educations[idx] = item : candidate.educations.push(item);
      closeModal(); renderProfile(); showToast("Riwayat pendidikan berhasil disimpan.");
    }
    function confirmDeleteEducation(id) {
      const item = candidate.educations.find(e => e.id === id);
      openDeleteModal("Hapus riwayat pendidikan ini?", `${item ? esc(item.level + " - " + item.institution) : ""}`, `deleteEducation(${id})`);
    }
    function deleteEducation(id) { candidate.educations = candidate.educations.filter(e => e.id !== id); closeModal(); renderProfile(); showToast("Riwayat pendidikan dihapus."); }

    function openWork(id) {
      const item = candidate.works.find(w => w.id === id) || { id:null, company:"", position:"", start:"", end:"", current:false };
      openModal(`${item.id ? "Ubah" : "Tambah"} Pengalaman Kerja`, workForm(item), `<button class="btn green" onclick="saveWork(${item.id || 0})">Simpan</button><button class="btn secondary" onclick="closeModal()">Batal</button>`);
      toggleWorkEnd();
    }
    function workForm(w) { return `<div class="grid cols-2"><div><label>Nama Perusahaan</label><input class="form-control" id="workCompany" value="${esc(w.company)}"></div><div><label>Nama Posisi</label><input class="form-control" id="workPosition" value="${esc(w.position)}"></div><div><label>Periode Mulai</label><input class="form-control" type="month" id="workStart" value="${esc(w.start)}"></div><div><label>Periode Selesai</label><input class="form-control" type="month" id="workEnd" value="${esc(w.end)}"></div><label class="checkline"><input type="checkbox" id="workCurrent" ${w.current ? "checked" : ""} onchange="toggleWorkEnd()"> Masih Bekerja</label></div>`; }
    function toggleWorkEnd() { if ($("workEnd")) { $("workEnd").disabled = $("workCurrent").checked; if ($("workCurrent").checked) $("workEnd").value = ""; } }
    function saveWork(id) {
      const item = { id:id || Date.now(), company:$("workCompany").value, position:$("workPosition").value, start:$("workStart").value, end:$("workEnd").value, current:$("workCurrent").checked };
      if (!item.company || !item.position || !item.start) return showToast("Perusahaan, posisi, dan periode mulai wajib diisi.", true);
      if (!item.current && item.end && item.end < item.start) return showToast("Periode selesai tidak boleh lebih awal dari periode mulai.", true);
      const idx = candidate.works.findIndex(w => w.id === id);
      idx >= 0 ? candidate.works[idx] = item : candidate.works.push(item);
      closeModal(); renderProfile(); showToast("Pengalaman kerja berhasil disimpan.");
    }
    function confirmDeleteWork(id) {
      const item = candidate.works.find(w => w.id === id);
      openDeleteModal("Hapus pengalaman kerja ini?", `${item ? esc(item.position + " - " + item.company) : ""}`, `deleteWork(${id})`);
    }
    function deleteWork(id) { candidate.works = candidate.works.filter(w => w.id !== id); closeModal(); renderProfile(); showToast("Pengalaman kerja dihapus."); }

    function openWithdraw(id) {
      openModal("Konfirmasi Pengunduran Diri", `<label>Alasan Pengunduran Diri</label><textarea class="form-control" id="withdrawReason" placeholder="Tulis alasan"></textarea>`, `<button class="btn red" onclick="confirmWithdraw(${id})">Konfirmasi</button><button class="btn secondary" onclick="closeModal()">Batal</button>`, "small");
    }
    function confirmWithdraw(id) {
      const reason = $("withdrawReason").value.trim();
      if (!reason) return showToast("Alasan pengunduran diri wajib diisi.", true);
      const app = applications.find(a => Number(a.id) === Number(id) && Number(a.candidate_id) === CURRENT_CANDIDATE_ID);
      if (!app || app.status !== "PROCESSING") { closeModal(); showToast("Lamaran ini tidak dapat diubah.", true); return; }
      const now = nowDateTime();
      app.status = "WITHDRAWN"; app.status_reason = reason; app.status_changed_at = now; app.status_changed_by = CURRENT_PORTAL_ACTOR; app.updated_at = now; app.updated_by = CURRENT_PORTAL_ACTOR;
      reconcilePortalTests();
      persistTestState();
      closeModal(); renderApplicationDetail(id); showToast("Lamaran berhasil diubah menjadi Mengundurkan Diri.");
    }
    function openModal(title, body, foot, size="") {
      $("modalBackdrop").innerHTML = `<div class="modal ${size}"><div class="modal-head"><span>${title}</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot}</div></div>`;
      $("modalBackdrop").classList.add("show");
    }
    function openDeleteModal(message, summary, okAction) {
      $("modalBackdrop").innerHTML = `<div class="modal delete-modal"><div class="delete-icon">!</div><p class="delete-message">${message}</p>${summary ? `<div class="delete-summary">${summary}</div>` : ""}<div class="delete-actions"><button class="btn red" onclick="${okAction}">Hapus</button><button class="btn secondary" onclick="closeModal()">Batal</button></div></div>`;
      $("modalBackdrop").classList.add("show");
    }
    function closeModal() { $("modalBackdrop").classList.remove("show"); $("modalBackdrop").innerHTML = ""; }
    $("modalBackdrop").addEventListener("click", e => { if (e.target.id === "modalBackdrop") closeModal(); });
    initPortalTests();
    verifyTestFileBinaries();
    render();
  </script>
</body>
</html>
