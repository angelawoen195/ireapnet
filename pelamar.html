    function renderVacancyCards() {

    function vacancyCardHtml(v) {

    function submitApplication(id) {
      if (!isProfileComplete()) { showToast("Profil harus dilengkapi sebelum mengirim lamaran.", true, `<button class="btn small" onclick="go('profile')">Menuju Profil Saya</button>`); return; }
      if (applications.some(a => Number(a.candidate_id) === CURRENT_CANDIDATE_ID && a.status === "PROCESSING")) { showToast("Anda masih memiliki lamaran berstatus Diproses.", true, `<button class="btn small" onclick="go('applications')">Menuju Lamaran Saya</button>`); return; }
      const completed = applications.filter(a => Number(a.candidate_id) === CURRENT_CANDIDATE_ID && a.status !== "PROCESSING" && a.status_changed_at).map(a => new Date(a.status_changed_at)).sort((a,b) => b-a);
      const last = completed[0];
      if (last && ((new Date() - last) / 86400000) < WAITING_DAYS) { showToast(`Masa tunggu ${WAITING_DAYS} hari sejak status lamaran terakhir berubah belum terpenuhi.`, true); return; }
      const salaryRaw = $("salary").value;
      if (salaryRaw !== "" && Number(salaryRaw) < 0) { showToast("Ekspektasi gaji tidak boleh negatif.", true); return; }
      const v = vacancy(id);
      if (!v.employee_requisition_id) { showToast("Lowongan tidak ditemukan.", true); return; }
      const stage = firstActiveStage();
      if (!stage) { showToast("Tahap lamaran aktif belum tersedia.", true); return; }
      const now = nowDateTime();
      const nextId = Math.max(...applications.map(a => Number(a.id) || 0), 0) + 1;
      const app = { id: nextId, application_number: generateApplicationNumber(), candidate_id: CURRENT_CANDIDATE_ID, employee_requisition_id: Number(v.employee_requisition_id), company_id: Number(v.company_id), applied_at: now, recruitment_stage_id: stage.id, status:"PROCESSING", stage_changed_at: now, stage_changed_by: CURRENT_PORTAL_ACTOR, status_changed_at: "", status_changed_by: "", available_start_date:$("available").value || null, expected_salary: salaryRaw === "" ? null : Number(salaryRaw), candidate_note:$("note").value, admin_note:"", status_reason:"", employee_id:null, created_at:now, created_by:CURRENT_PORTAL_ACTOR, updated_at:now, updated_by:CURRENT_PORTAL_ACTOR };
      applications.unshift(app);
      state.tempFiles.forEach(fileName => {
        const attachmentId = Math.max(...window.iReapNetAttachments.map(item => Number(item.id) || 0), 0) + 1;
        const relationId = Math.max(...window.recruitmentApplicationAttachments.map(item => Number(item.id) || 0), 0) + 1;
        window.iReapNetAttachments.push({ id: attachmentId, file_name: fileName, file_size: null, file_type: "", uploaded_at: now, uploaded_by: CURRENT_PORTAL_ACTOR });
        window.recruitmentApplicationAttachments.push({ id: relationId, application_id: nextId, attachment_id: attachmentId });
      });
      showToast("Lamaran berhasil dikirim.");
      go("applicationDetail", app.id);
    }

    function openEducation(id) {

      openModal(`${item.id ? "Ubah" : "Tambah"} Pendidikan`, educationForm(item), `<button class="btn green" onclick="saveEducation(${item.id || 0})">Simpan</button><button class="btn secondary" onclick="closeModal()">Batal</button>`);

    function openWithdraw(id) {
      openModal("Konfirmasi Pengunduran Diri", `<label>Alasan Pengunduran Diri</label><textarea class="form-control" id="withdrawReason" placeholder="Tulis alasan"></textarea>`, `<button class="btn red" onclick="confirmWithdraw(${id})">Konfirmasi</button><button class="btn secondary" onclick="closeModal()">Batal</button>`, "small");
    }
    function confirmWithdraw(id) {
      const reason = $("withdrawReason").value.trim();
      if (!reason) return showToast("Alasan pengunduran diri wajib diisi.", true);
      const app = applications.find(a => Number(a.id) === Number(id) && Number(a.candidate_id) === CURRENT_CANDIDATE_ID);
      if (!app || app.status !== "PROCESSING") { closeModal(); showToast("Lamaran ini tidak dapat diubah.", true); return; }
      const now = nowDateTime();
      app.status = "WITHDRAWN"; app.status_reason = reason; app.status_changed_at = now; app.status_changed_by = CURRENT_PORTAL_ACTOR; app.updated_at = now; app.updated_by = CURRENT_PORTAL_ACTOR;

    function openModal(title, body, foot, size="") {

      $("modalBackdrop").classList.add("show");
    }
    function openDeleteModal(message, summary, okAction) {
      $("modalBackdrop").innerHTML = `<div class="modal delete-modal"><div class="delete-icon">!</div><p class="delete-message">${message}</p>${summary ? `<div class="delete-summary">${summary}</div>` : ""}<div class="delete-actions"><button class="btn red" onclick="${okAction}">Hapus</button><button class="btn secondary" onclick="closeModal()">Batal</button></div></div>`;
      $("modalBackdrop").classList.add("show");
    }
    function closeModal() { $("modalBackdrop").classList.remove("show"); $("modalBackdrop").innerHTML = ""; }
    $("modalBackdrop").addEventListener("click", e => { if (e.target.id === "modalBackdrop") closeModal(); });
    render();
  </script>
</body>
</html>
